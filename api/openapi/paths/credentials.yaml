userCredentials:
  get:
    operationId: ListUserCredentials
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 当前用户拥有的凭据元数据
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/CredentialList'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateUserCredential
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credential.yaml#/CreateCredentialRequest'
    responses:
      '201':
        description: 创建凭据和首个加密版本
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/Credential'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

orgCredentials:
  parameters:
    - $ref: '../base.yaml#/components/parameters/OrgId'
  get:
    operationId: ListOrgCredentials
    security:
      - bearerAuth: []
    description: 仅组织管理员可管理凭据。
    responses:
      '200':
        description: 组织凭据元数据
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/CredentialList'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateOrgCredential
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credential.yaml#/CreateCredentialRequest'
    responses:
      '201':
        description: 创建组织凭据
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/Credential'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

credentialVersions:
  parameters:
    - name: credentialId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  get:
    operationId: ListCredentialVersions
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 版本元数据，不返回密钥或密文
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/CredentialVersionList'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: RotateCredential
    description: 创建新版本并设置为当前；现存任务仍使用原版本。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/credential.yaml#/RotateCredentialRequest'
    responses:
      '201':
        description: 新版本绑定
        content:
          application/json:
            schema:
              $ref: '../components/schemas/credential.yaml#/CredentialBinding'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

credentialVersionRevoke:
  parameters:
    - name: credentialId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  post:
    operationId: RevokeCredentialVersion
    description: 撤销固定版本；所有共享 Backend 与现存执行的后续调用、恢复均被拒绝。
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 已撤销（幂等）
      default:
        $ref: '../base.yaml#/components/responses/Problem'

credentialCollect:
  parameters:
    - name: credentialId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  post:
    operationId: CollectCredentialVersions
    description: 由运行中的服务显式回收非当前且无 Job 引用、无执行 lease 的版本；所有现存任务均保留引用直至删除。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 已删除版本数
        content:
          application/json:
            schema:
              type: object
              required: [deleted_versions]
              properties:
                deleted_versions:
                  type: integer
                  minimum: 0
      default:
        $ref: '../base.yaml#/components/responses/Problem'
