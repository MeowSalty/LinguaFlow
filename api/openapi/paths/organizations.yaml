organizations:
  get:
    operationId: ListOrganizations
    summary: 列出当前用户所属组织
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 组织列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/OrganizationListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateOrganization
    description: 创建组织及首位 owner 原子提交。name 与 slug 分别全局唯一，冲突为 409 organization_name_exists 或 organization_slug_exists。
    summary: 创建组织
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/OrganizationRequest'
    responses:
      '201':
        description: 已创建组织
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Organization'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

organizationById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/OrgId'
  get:
    operationId: GetOrganization
    summary: 获取组织详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 组织详情
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Organization'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdateOrganization
    description: 仅 owner/admin 可更新；name 与 slug 必填且各自唯一。可选资料省略保留、空串清空、null 拒绝。名称及 slug 冲突与创建采用相同的专用 409 Problem。
    summary: 更新组织信息
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/OrganizationRequest'
    responses:
      '200':
        description: 更新后的组织
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Organization'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

organizationMembers:
  parameters:
    - $ref: '../base.yaml#/components/parameters/OrgId'
  get:
    operationId: ListOrganizationMembers
    summary: 获取组织成员列表
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 成员列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/OrganizationMemberListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: AddOrganizationMember
    description: 精确用户名添加已有账号并立即生效。admin 仅能添加 member，owner 可添加任意角色；重复成员返回 409 membership_exists。
    summary: 添加组织成员
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/AddOrganizationMemberRequest'
    responses:
      '201':
        description: 已添加成员
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/OrganizationMember'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

organizationMemberByUserId:
  parameters:
    - $ref: '../base.yaml#/components/parameters/OrgId'
    - $ref: '../base.yaml#/components/parameters/UserId'
  put:
    operationId: UpdateOrganizationMember
    description: 仅 owner 可修改，非法或缺失角色返回 400；最后 owner 不得降级，返回 409 owner_required。校验与修改在数据库锁保护的同一事务中执行。
    summary: 修改组织成员角色
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/UpdateOrganizationMemberRequest'
    responses:
      '200':
        description: 更新后的成员
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/OrganizationMember'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  delete:
    operationId: DeleteOrganizationMember
    summary: 移除成员或主动退出组织
    description: 本人可退出，必须保留至少一位 owner；owner 可移除他人，admin 仅能移除 member。最后 owner 冲突为 409 owner_required；不存在目标成员为 404，非成员再次退出为 403。成功返回 204，不删除账号或组织项目。
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 已移除成员
      default:
        $ref: '../base.yaml#/components/responses/Problem'
