checkStorage:
  parameters:
    - name: connectionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  post:
    operationId: CheckStorageConnection
    summary: Verify the connection and its managed spaces
    description: Read checks never write; explicit write checks persist and clean exact probe objects. Requires connection ownership or site administrator access.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [write_check, expected_generation]
            properties:
              write_check:
                type: boolean
              expected_generation:
                type: integer
                format: int64
                minimum: 0
    responses:
      '200':
        description: Verified connection metadata
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage.yaml#/StorageConnection'
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
