storageCapabilities:
  get:
    operationId: GetStorageCapabilities
    summary: Discover storage management capabilities
    description: >-
      Metadata-only discovery for an active authenticated account. User scope is always
      the current user and forbids organization_id; org scope requires a positive
      organization_id and organization owner/admin membership. Platform administrators
      do not bypass organization membership. Unknown, repeated and empty parameters
      are rejected. Disabled deployment returns a normal 200 response, even when no
      connections or spaces exist. Responses are private and must not be cached.
    security:
      - bearerAuth: []
    parameters:
      - name: scope
        in: query
        required: true
        schema:
          type: string
          enum: [user, org]
      - name: organization_id
        in: query
        schema:
          type: integer
          minimum: 1
    responses:
      '200':
        description: Current subject management capabilities
        headers:
          Cache-Control:
            schema:
              type: string
              enum: ['private, no-store']
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage.yaml#/StorageCapabilities'
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
storageDiagnostics:
  get:
    operationId: GetStorageDiagnostics
    summary: 查看存储容量、恢复积压与备份状态
    description: 仅平台管理员。只聚合平台登记的数据库事实与临时盘预留，不探测远端、扫描对象桶或产生写入；cursor 是上一页末空间 ID。
    security:
      - bearerAuth: []
    parameters:
      - name: cursor
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: 只读存储诊断
        content:
          application/json:
            schema:
              $ref: '../components/schemas/storage-diagnostics.yaml#/StorageDiagnostics'
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
