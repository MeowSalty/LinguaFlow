accessibleJobs:
  get:
    operationId: ListAccessibleJobs
    summary: 列出当前用户可访问的跨项目翻译任务
    description: |
      按项目读取权限查询，包含组织项目内其他成员创建的任务。
      未指定 state 或 status 时默认查询 pending、running、paused。
      state 与 status 互斥。project_id 不存在或无读取权限时返回空列表。
      按 updated_at DESC、id DESC 排序；cursor 是不透明游标，仅用于原筛选条件的续页。
      任务更新会改变排序，本接口不提供跨请求快照；轮询应从首页重新查询并按 ID 去重，
      不能将单页中缺少某任务解释为任务已结束。
      limit 缺省为 50，最大为 100；未知、重复或空查询参数返回 400。
    security:
      - bearerAuth: []
    parameters:
      - name: state
        in: query
        schema:
          type: string
          enum: [active, terminal, all]
        description: active 包含 pending/running/paused；terminal 包含 completed/failed/cancelled；与 status 互斥
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, running, paused, completed, failed, cancelled]
        description: 精确单状态筛选，与 state 互斥
      - $ref: '#/jobProjectFilter'
      - $ref: '#/jobTriggerFilter'
      - name: updated_from
        in: query
        schema:
          type: string
          format: date-time
        description: 更新时间下界（包含），RFC3339；与 updated_before 同传时必须更早
      - name: updated_before
        in: query
        schema:
          type: string
          format: date-time
        description: 更新时间上界（不包含），RFC3339
      - name: cursor
        in: query
        schema:
          type: string
        description: 上一页返回的不透明 next_cursor，不兼容项目任务列表的数字游标
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 轻量任务列表；队列位置与队列总数在本阶段固定为 null
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobSummaryListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobsSummary:
  get:
    operationId: GetJobsSummary
    summary: 获取当前用户可访问任务的数量摘要
    description: |
      只支持 project_id 和 trigger_type 筛选，不接受状态、时间或分页参数。
      未知、重复或空查询参数返回 400。
      活动状态数量不受时间限制。recent_failed 统计当前为 failed 且 updated_at 位于
      [recent_failed_since, as_of) 内的任务，窗口为连续 7×24 小时，不是失败事件次数。
      项目读取权限与 GET /jobs 一致；无权或不存在的项目返回全部为零的计数。
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/jobProjectFilter'
      - $ref: '#/jobTriggerFilter'
    responses:
      '200':
        description: 独立于分页的任务数量摘要
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobsSummaryResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobProjectFilter:
  name: project_id
  in: query
  schema:
    type: integer
    minimum: 1

jobTriggerFilter:
  name: trigger_type
  in: query
  schema:
    type: string
    enum: [manual, file_update, glossary_change, web_edit]

projectJobs:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
  get:
    operationId: ListJobs
    summary: 列出项目任务
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, running, paused, completed, failed, cancelled]
      - name: trigger_type
        in: query
        required: false
        schema:
          type: string
          enum: [manual, file_update, glossary_change, web_edit]
      - $ref: '../base.yaml#/components/parameters/Cursor'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 任务列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateJob
    summary: 创建任务
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/CreateJobRequest'
    responses:
      '202':
        description: 任务已创建
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: GetJob
    summary: 获取任务详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 任务详情
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobCancel:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: CancelJob
    summary: 取消任务
    description: |
      取消任务（运行中或排队中）。取消后任务可再次通过 retry 恢复执行。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 取消后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobRetry:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: RetryJob
    summary: 重试失败或已取消的任务
    description: |
      对失败或已取消的任务重新发起执行：失败/取消的资源重新入队，
      已完成的轮次与已翻译段落直接跳过，从当前进度断点继续。
      例外：显式选段（segment_ids 手动选择）的任务，首个翻译轮
      会重译所有选中段落。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 重试后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobPause:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: PauseJob
    summary: 暂停任务
    description: |
      优雅暂停——停止派发新批次并等待在途 LLM 请求返回后冻结任务。
      暂停后可通过 resume 从轮次断点恢复。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 暂停后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobResume:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: ResumeJob
    summary: 恢复已暂停的任务
    description: 从轮次断点恢复已暂停的任务。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 恢复后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobStream:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: StreamJobEvents
    summary: 订阅任务实时事件流 (SSE)
    description: |
      以 Server-Sent Events 推送任务实时事件。

      - 认证：除 bearerAuth 外，原生 EventSource 无法设置自定义请求头，
        可改用 `access_token` 查询参数携带访问令牌。
      - 断线重连：通过标准 `Last-Event-ID` 请求头或 `lastEventId` 查询参数
        传入上次收到的 seq，从该位置继续；省略时仅回放最近一个有限窗口
        （更早的历史请走 `GET /jobs/{jobId}/events`）。
      - 帧格式：每条事件为一个 SSE 帧
        `id: <seq>`、`event: <事件类型>`、`data: <JobEvent JSON>`；
        注释行（`: connected`、`: keepalive <unix>`）用于连接确认与保活。
    security:
      - bearerAuth: []
    parameters:
      - name: access_token
        in: query
        required: false
        schema:
          type: string
        description: 访问令牌（用于无法设置 Authorization 头的 EventSource）
      - name: lastEventId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
        description: 断线重连游标，等价于 Last-Event-ID 请求头；0 或缺省表示从最近窗口开始
    responses:
      '200':
        description: SSE 事件流（帧格式见操作描述）
        content:
          text/event-stream:
            schema:
              type: string
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobEvents:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: ListJobEvents
    summary: 列出任务的历史事件
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../base.yaml#/components/parameters/AfterSeq'
      - $ref: '../base.yaml#/components/parameters/BeforeSeq'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 任务历史事件列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobEventListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
