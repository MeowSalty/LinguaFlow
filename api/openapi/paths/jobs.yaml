projectJobs:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
  get:
    operationId: ListJobs
    summary: 列出项目任务
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, running, paused, completed, failed, cancelled]
      - name: trigger_type
        in: query
        required: false
        schema:
          type: string
          enum: [manual, file_update, glossary_change, web_edit]
      - $ref: '../base.yaml#/components/parameters/Cursor'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 任务列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateJob
    summary: 创建任务
    security:
      - bearerAuth: []
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/CreateJobRequest'
    responses:
      '202':
        description: 任务已创建
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: GetJob
    summary: 获取任务详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 任务详情
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobCancel:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: CancelJob
    summary: 取消任务
    description: |
      取消任务（运行中或排队中）。取消后任务可再次通过 retry 恢复执行。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 取消后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobRetry:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: RetryJob
    summary: 重试失败或已取消的任务
    description: |
      对失败或已取消的任务重新发起执行：失败/取消的资源重新入队，
      已完成的轮次与已翻译段落直接跳过，从当前进度断点继续。
      例外：显式选段（segment_ids 手动选择）的任务，首个翻译轮
      会重译所有选中段落。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 重试后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobPause:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: PauseJob
    summary: 暂停任务
    description: |
      优雅暂停——停止派发新批次并等待在途 LLM 请求返回后冻结任务。
      暂停后可通过 resume 从轮次断点恢复。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 暂停后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobResume:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  post:
    operationId: ResumeJob
    summary: 恢复已暂停的任务
    description: 从轮次断点恢复已暂停的任务。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 恢复后的任务
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Job'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobStream:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: StreamJobEvents
    summary: 订阅任务实时事件流 (SSE)
    description: |
      以 Server-Sent Events 推送任务实时事件。

      - 认证：除 bearerAuth 外，原生 EventSource 无法设置自定义请求头，
        可改用 `access_token` 查询参数携带访问令牌。
      - 断线重连：通过标准 `Last-Event-ID` 请求头或 `lastEventId` 查询参数
        传入上次收到的 seq，从该位置继续；省略时仅回放最近一个有限窗口
        （更早的历史请走 `GET /jobs/{jobId}/events`）。
      - 帧格式：每条事件为一个 SSE 帧
        `id: <seq>`、`event: <事件类型>`、`data: <JobEvent JSON>`；
        注释行（`: connected`、`: keepalive <unix>`）用于连接确认与保活。
    security:
      - bearerAuth: []
    parameters:
      - name: access_token
        in: query
        required: false
        schema:
          type: string
        description: 访问令牌（用于无法设置 Authorization 头的 EventSource）
      - name: lastEventId
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
        description: 断线重连游标，等价于 Last-Event-ID 请求头；0 或缺省表示从最近窗口开始
    responses:
      '200':
        description: SSE 事件流（帧格式见操作描述）
        content:
          text/event-stream:
            schema:
              type: string
      default:
        $ref: '../base.yaml#/components/responses/Problem'

jobEvents:
  parameters:
    - $ref: '../base.yaml#/components/parameters/JobId'
  get:
    operationId: ListJobEvents
    summary: 列出任务的历史事件
    security:
      - bearerAuth: []
    parameters:
      - $ref: '../base.yaml#/components/parameters/AfterSeq'
      - $ref: '../base.yaml#/components/parameters/BeforeSeq'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 任务历史事件列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/JobEventListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
