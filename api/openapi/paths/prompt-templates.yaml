promptTemplates:
  get:
    description: 不传 org_id 时返回个人和系统模板；显式 org_id 时仅返回该组织对象，要求当前成员资格。拒绝未知、重复、空值和非法查询参数。
    parameters:
      - name: org_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 组织不存在返回 404，非成员返回 403。
    operationId: ListPromptTemplates
    summary: 列出当前用户的翻译提示词模板
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 翻译提示词模板列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/prompt-template.yaml#/TranslationPromptTemplateListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreatePromptTemplate
    summary: 创建翻译提示词模板
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/prompt-template.yaml#/CreateTranslationPromptTemplateRequest'
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/prompt-template.yaml#/TranslationPromptTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

promptTemplateById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/TranslationPromptTemplateId'
  get:
    operationId: GetPromptTemplate
    summary: 获取翻译提示词模板详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 翻译提示词模板详情
        content:
          application/json:
            schema:
              $ref: '../components/schemas/prompt-template.yaml#/TranslationPromptTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdatePromptTemplate
    summary: 更新翻译提示词模板
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/prompt-template.yaml#/UpdateTranslationPromptTemplateRequest'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/prompt-template.yaml#/TranslationPromptTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  delete:
    operationId: DeletePromptTemplate
    summary: 删除翻译提示词模板
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 删除成功
      default:
        $ref: '../base.yaml#/components/responses/Problem'
