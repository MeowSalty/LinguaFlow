      remain replayable after authorization.
      Recovery requires connection management permission, expected_generation,
      expected_management_generation and Idempotency-Key, scoped to ownership, normalized
      immutable target and this recovery operation. Same key with different input conflicts;
      an accepted idempotent result is replayed first, authenticated and preserves the same retirement. Only stored connections
