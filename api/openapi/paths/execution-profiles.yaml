executionProfiles:
  get:
    description: 不传 org_id 时返回个人和系统配置；显式 org_id 时仅返回该组织对象，要求当前成员资格。拒绝未知、重复、空值和非法查询参数。
    parameters:
      - name: org_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 组织不存在返回 404，非成员返回 403。
    operationId: ListExecutionProfiles
    summary: 列出当前用户的执行策略配置
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 执行策略配置列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-profile.yaml#/ExecutionProfileListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateExecutionProfile
    summary: 创建执行策略配置
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
              $ref: '../components/schemas/execution-profile.yaml#/CreateExecutionProfileRequest'
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-profile.yaml#/ExecutionProfile'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

executionProfileById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ExecutionProfileId'
  get:
    operationId: GetExecutionProfile
    summary: 获取执行策略配置详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 执行策略配置详情
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-profile.yaml#/ExecutionProfile'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdateExecutionProfile
    summary: 更新执行策略配置
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
              $ref: '../components/schemas/execution-profile.yaml#/UpdateExecutionProfileRequest'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-profile.yaml#/ExecutionProfile'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  delete:
    operationId: DeleteExecutionProfile
    summary: 删除执行策略配置
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 删除成功
      default:
        $ref: '../base.yaml#/components/responses/Problem'
