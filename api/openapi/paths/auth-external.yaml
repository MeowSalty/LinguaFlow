    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/ExternalLinkStartRequest"
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/ExternalStartResponse"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
