start:
  parameters:
    -
      name: "connectionId"
      in: "path"
      required: true
      schema:
        type: "string"
  post:
    operationId: "StartExternalAuthentication"
    summary: "开始已发布外部渠道登录"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503."
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/ExternalBrowserInput"
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/ExternalStartResponse"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
callback:
  parameters:
    -
      name: "connectionId"
      in: "path"
      required: true
      schema:
        type: "string"
  get:
    operationId: "ExternalAuthenticationCallback"
    summary: "接收固定外部认证回调"
    description: "Claims the transaction before contacting the provider. Invalid state never redirects. Valid success/failure redirects only to the stored trusted completion URL with a one-use ticket."
    security: []
    responses:
      303:
        description: "Trusted completion URL; no access or refresh token in the URL"
        headers:
          Location:
            schema:
              type: "string"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
exchange:
  post:
    operationId: "ExchangeExternalAuthentication"
    summary: "交换浏览器绑定的一次性票据"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503. An associated user flow additionally requires the same valid Bearer identity; anonymous signup/login uses the browser verifier."
    security:
      - {}
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/ExternalExchangeRequest"
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/ExternalExchangeResponse"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
