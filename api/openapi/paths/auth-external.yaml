unlink:
  parameters:
    -
      name: "bindingId"
      in: "path"
      required: true
      schema:
        type: "integer"
  delete:
    operationId: "DeleteCurrentUserLoginBinding"
    summary: "安全解绑并撤销旧会话"
    description: "仅 server 模式。必须使用另一登录方式的近期认证证明；目标绑定不能证明自身的删除操作。不满足证明要求返回 403，无可靠后备方式返回 409。成功撤销旧会话及相关认证事务，最后一个绑定移除后释放外部身份归属；审计保留。响应使用 Cache-Control: no-store。"
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/SensitiveOperationRequest"
    responses:
      204:
        description: "Completed"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"

