projectResources:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
  get:
    operationId: ListProjectResources
    summary: 列出项目资源文件
    security:
      - bearerAuth: []
    parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - $ref: '../base.yaml#/components/parameters/Cursor'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 资源列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ResourceListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: UploadProjectResources
    summary: 上传资源文件到项目
    description: |
      批量上传资源文件，允许部分成功。
      - files 与 paths 按数组下标一一对应
      - paths 使用 / 分隔，例如 ui/common.json、admin/common.json
      - 未提供 paths 时兼容旧客户端，使用上传文件名作为根目录资源路径
      - 项目内资源唯一性以规范化 path 判断，而不是 filename
      - 冲突或失败的文件不会阻断其他文件的上传，每个文件独立返回处理结果
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [files]
            properties:
              files:
                type: array
                maxItems: 50
                items:
                  type: string
                  format: binary
              paths:
                type: array
                description: 与 files 一一对应的项目内资源相对路径；省略时使用文件名作为根目录路径
                items:
                  type: string
    responses:
      '200':
        description: 批量上传结果（可能包含部分冲突或失败）
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ResourceUploadBatchResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourcePrecheck:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
  post:
    operationId: PrecheckProjectResources
    summary: 上传资源预检
    description: |
      在实际上传前检查批量文件中的冲突情况，不执行任何写入操作。
      - 检查批次内是否有重复路径
      - 检查每个路径是否与项目已有资源冲突
      - 返回每个文件的建议操作（create / conflict / duplicate）
      - 前端可根据结果让用户确认冲突处理策略后再执行实际上传
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [paths]
            properties:
              paths:
                type: array
                minItems: 1
                maxItems: 50
                items:
                  type: string
                description: 待检查的项目内资源相对路径列表（不包含实际文件）
    responses:
      '200':
        description: 预检结果
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ResourcePrecheckBatchResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceTree:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
  get:
    operationId: GetProjectResourceTree
    summary: 获取项目资源目录树
    description: |
      按资源 path 聚合生成目录树。当前目录为虚拟节点，资源身份仍由 Resource.path 唯一确定；后续可在此基础上扩展目录移动、重命名等能力。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 资源目录树
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ResourceTreeResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
    - $ref: '../base.yaml#/components/parameters/ResourceId'
  get:
    operationId: GetResource
    summary: 获取资源详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 资源详情
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Resource'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdateResource
    summary: 更新资源文件
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/Resource'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: IncrementalUpdateResource
    summary: 增量更新资源文件
    description: |
      上传新版本文件，系统自动对比段落变化：
      - 相同源文本的段落保留已有译文
      - 源文本变化的段落重置为待翻译
      - 新增段落状态为待翻译
      - 不再存在的段落将被删除
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
    responses:
      '200':
        description: 增量更新成功
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/IncrementalUpdateResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  delete:
    operationId: DeleteResource
    summary: 删除资源文件及其所有段落
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 删除成功
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceDownload:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
    - $ref: '../base.yaml#/components/parameters/ResourceId'
  get:
    operationId: DownloadResourceFile
    summary: 下载资源原始文件
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 资源原始文件
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceDownloadTranslated:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
    - $ref: '../base.yaml#/components/parameters/ResourceId'
  get:
    operationId: DownloadTranslatedResourceFile
    summary: 下载资源的翻译结果文件
    description: |
      基于资源当前所有已翻译/已编辑的 segments，渲染并下载翻译后的文件。
      不依赖翻译任务状态，直接读取资源级别的最新翻译数据。
      如果没有任何已翻译的段落，返回 409 Conflict。
      渲染前会预检译文标签结构：存在无法原样嵌入导出文档的译文时（如标签未闭合）
      返回 409 Conflict，detail 给出缺陷段落编号与原因。此时不写出任何文件内容，
      避免把「该章整章回退为原文」的残缺结果静默交付给用户。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 翻译结果文件
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceSegments:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ProjectId'
    - $ref: '../base.yaml#/components/parameters/ResourceId'
  get:
    operationId: ListResourceSegments
    summary: 列出资源段落
    security:
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, translated, edited, approved, rejected]
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: group_key
        in: query
        required: false
        schema:
          type: string
        description: 按分组键过滤 segments（如 epub_file 路径），仅返回属于指定分组的 segments
      - name: quality_issues
        in: query
        required: false
        schema:
          type: string
          enum: [has, none]
        description: 按 quality_issues 过滤；has=仅有质量问题的段落，none=无质量问题的段落（NULL 或空数组均视为无问题）
      - name: quality_severity
        in: query
        required: false
        schema:
          type: string
          enum: [warning, error]
        description: 按 quality_issues 中的 severity 过滤；指定时隐含仅返回含匹配问题的段落
      - name: quality_code
        in: query
        required: false
        schema:
          type: string
          enum: [untranslated, length_ratio, duplicate, source_residual, punctuation_pairing, punctuation_missing, punctuation_surplus, punctuation_wrap_loss, whitespace_irregular, repeated_space, width_mix, script_mismatch, number_mismatch, url_email_mismatch, subtitle_line_count, forbidden_term, term_inconsistency, leftover_placeholder, xml_tag_mismatch, duplicate_source_divergence, calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register, ruby_restore_incomplete, ruby_tag_loss]
        description: 按 quality_issues 中的 code 过滤；指定时隐含仅返回含匹配问题的段落
      - name: search_field
        in: query
        required: false
        schema:
          type: string
          enum: [source, target, both]
          default: both
        description: 搜索字段范围；both 时同时匹配原文与译文（默认语义）
      - name: case_sensitive
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: 搜索是否区分大小写；默认 true 保持子串精确匹配语义
      - name: include_total
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: 是否在响应中附带满足过滤条件的段落总数（total）；为 true 时额外执行一次计数查询
      - $ref: '../base.yaml#/components/parameters/Cursor'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 段落列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ResourceSegmentListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

projectResourceSegmentById:
