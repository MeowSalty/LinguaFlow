attributes:
  parameters:
    - name: connectionId
      in: path
      required: true
      schema: {type: string}
  get:
    operationId: GetAuthConnectionAttributes
    summary: 获取指定版本的受信属性目录和可用运算符
    security: [{bearerAuth: []}]
    parameters:
      - name: expected_revision
        in: query
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    responses:
      '200':
        description: Attribute catalogue
        content:
          application/json:
            schema: {$ref: '../components/schemas/auth-rules.yaml#/AuthAttributeCatalog'}
      '400': {$ref: '../base.yaml#/components/responses/Problem'}
      '401': {$ref: '../base.yaml#/components/responses/Problem'}
      '403': {$ref: '../base.yaml#/components/responses/Problem'}
      '409': {$ref: '../base.yaml#/components/responses/Problem'}
      default: {$ref: '../base.yaml#/components/responses/Problem'}
  post:
    operationId: PreviewAuthConnectionAttributes
    summary: 获取候选版本的受信属性目录和可用运算符（不访问第三方）
    security: [{bearerAuth: []}]
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: '../components/schemas/auth-external.yaml#/AuthConnectionCandidateRequest'}
    responses:
      '200':
        description: Attribute catalogue for the candidate configuration
        content:
          application/json:
            schema: {$ref: '../components/schemas/auth-rules.yaml#/AuthAttributeCatalog'}
      '400': {$ref: '../base.yaml#/components/responses/Problem'}
      '401': {$ref: '../base.yaml#/components/responses/Problem'}
      '403': {$ref: '../base.yaml#/components/responses/Problem'}
      '409': {$ref: '../base.yaml#/components/responses/Problem'}
      default: {$ref: '../base.yaml#/components/responses/Problem'}
preview:
  parameters:
    - name: connectionId
      in: path
      required: true
