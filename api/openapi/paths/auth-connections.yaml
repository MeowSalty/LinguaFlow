collection:
  get:
    operationId: "ListAuthConnections"
    summary: "管理员列出认证连接"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503."
    security:
      -
        bearerAuth: []
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/AuthConnectionsResponse"
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
  post:
    operationId: "CreateAuthConnection"
    summary: "创建默认关闭的OIDC草稿"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503."
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/CreateAuthConnectionRequest"
    responses:
      201:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/AuthConnectionRecord"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
