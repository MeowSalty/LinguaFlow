      in: "path"
      required: true
      schema:
        type: "string"
  post:
    operationId: "PublishAuthConnection"
    summary: "管理员 publish 连接"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503."
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/AuthConnectionRevisionRequest"
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/AuthConnectionRecord"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        description: Revision conflict or users without a verified fallback. Safety conflicts include the current impact and remediation.
        content:
          application/problem+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/auth-rules.yaml#/AuthPublishProblem'
                - $ref: '../components/schemas/common.yaml#/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
