enable:
  parameters:
    -
      name: "connectionId"
      in: "path"
      required: true
      schema:
        type: "string"
  post:
    operationId: "EnableAuthConnection"

    summary: "启用连接并开放正式用途"
    description: "Server mode only. Requires complete configuration, fresh matching validation bound to the current admin session and browser proof, purpose switches, and fallback protection. Authentication secrets and flow results use Cache-Control: no-store."
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/AuthConnectionActionRequest"
    responses:
      200:
        description: "Result"
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth-external.yaml#/AuthConnectionRecord"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        description: "Revision conflict, incomplete configuration, missing/expired/mismatched test evidence, state conflict, or users without a verified fallback."
        content:
          application/problem+json:
            schema:
              anyOf:
                - $ref: '../components/schemas/auth-external.yaml#/AuthConnectionErrorProblem'
                - $ref: '../components/schemas/common.yaml#/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
disable:
  parameters:
    -
      name: "connectionId"
      in: "path"
      required: true
      schema:
        type: "string"
  post:
    operationId: "DisableAuthConnection"
    summary: "停用连接并撤销正式用途"
    description: "Server mode only. Stops all formal use, blocks new external requests, and revokes dependent sessions in one transaction. Disabled requires an explicit configure step before testing again."
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
