statsSummary:
  get:
    operationId: GetStatsSummary
    summary: 获取用量统计汇总
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 用量统计
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/UsageStats'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

activity:
  parameters:
    - name: org_id
      in: query
      required: false
      description: 仅查询指定组织的活动；正整数，不存在返回 404，非成员返回 403。拒绝未知、重复或空查询参数。
      schema:
        type: integer
        minimum: 1
    - $ref: '../base.yaml#/components/parameters/Cursor'
    - $ref: '../base.yaml#/components/parameters/Limit'
  get:
    operationId: ListActivity
    summary: 获取活动审计日志
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 活动审计日志
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/ActivityListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
