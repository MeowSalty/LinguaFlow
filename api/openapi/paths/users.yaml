currentUser:
  get:
    operationId: GetCurrentUser
    summary: 获取当前用户
    description: 服务器模式要求 bearer 认证；本地模式沿用免 bearer 的本地用户身份。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 当前用户
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/User'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdateCurrentUser
    summary: 更新当前用户资料
    description: |
      省略字段保持原值，空对象不修改资料。邮箱校验失败返回 400；已验证邮箱禁止直接替换（409）。未验证邮箱允许重复；失败不部分更新。
      服务器模式要求 bearer 认证；本地模式仍允许通过本地身份调用，页面只读不代表后端禁止写入。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/UpdateCurrentUserRequest'
    responses:
      '200':
        description: 更新后的用户
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/User'
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

currentUserPassword:
  post:
    operationId: "SetCurrentUserInitialPassword"
    summary: "首次设置本地密码并撤销旧会话"
    description: "Server mode only. Authentication secrets and flow results use Cache-Control: no-store. Invalid or consumed flows return 400; reauthentication proofs 403; policy/revision conflicts 409; upstream failures 503."
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/InitialPasswordRequest"
    responses:
      204:
        description: "Completed"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
  delete:
    operationId: "DeleteCurrentUserPassword"
    summary: "删除密码并保留可靠后备方式"
    description: "仅 server 模式。要求另一登录方式的近期认证证明，不能使用待删除密码生成的证明；证明不符合要求返回 403，无可靠后备方式或最后密码管理员保护冲突返回 409。成功后撤销旧会话，响应使用 Cache-Control: no-store。"
    security:
      -
        bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth-external.yaml#/SensitiveOperationRequest"
    responses:
      204:
        description: "Completed"
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '404':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '429':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: "../base.yaml#/components/responses/Problem"
  put:
    operationId: ChangeCurrentUserPassword
    summary: 修改当前用户密码
    description: |
      核验当前密码后原子更新密码、递增账号认证版本并撤销全部刷新会话。旧 access 在后续鉴权失效；已连接 SSE 有界中止。成功后须重新登录，不在改密响应中签发替代会话。
      缺失、空值、非法类型或新密码长度不合法返回 400；非空旧密码错误返回专用
      urn:linguaflow:current-password-mismatch Problem（400），不会被当作认证失效。
      401 仅表示请求认证缺失或失效。本地模式沿用现有本地身份授权，页面不提供密码表单。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/ChangePasswordRequest'
    responses:
      '204':
        description: 密码已更新
      '400':
        description: 参数不合法，或旧密码不匹配（type 为 urn:linguaflow:current-password-mismatch）。
        content:
          application/problem+json:
            schema:
              $ref: '../base.yaml#/components/schemas/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
