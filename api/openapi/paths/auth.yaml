capabilities:
  get:
    operationId: GetAuthCapabilities
    summary: 获取当前实例可用认证入口
    description: 仅公开已实现且有效的入口能力，不披露用户或私有政策。读取失败不能解释为允许注册。local 不提供登录入口。
    security: []
    responses:
      '200':
        description: 当前能力快照
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/AuthCapabilities'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

register:
  post:
    operationId: RegisterAuth
    summary: 注册用户并签发会话
    description: 新密码须满足至少 8 个 Unicode 码点、最多 72 个 UTF-8 字节；不符合时返回 400。公开注册仅创建普通用户。数据库政策关闭注册时返回 403，政策缺失、损坏或读取故障返回 503。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/RegisterRequest'
    responses:
      '201':
        description: 已创建
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/AuthSession'
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      '409':
        $ref: '../base.yaml#/components/responses/Problem'
      '503':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

login:
  post:
    operationId: LoginAuth
    summary: 用户登录
    description: 仅接受 identifier/password。字段错误返回 400；无效标识、关闭的标识入口、不存在或停用账号、未设密码及密码错误统一返回 401。政策不可用返回 503。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/LoginRequest'
    responses:
      '200':
        description: 登录成功
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/AuthSession'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

refresh:
  post:
    operationId: RefreshAuth
    summary: 刷新访问令牌
    description: 原子轮换同一刷新会话链。已消费 token 重放会撤销整条链，无重试宽限期；并发刷新至多一次签发且成功方后继也可能被重放撤销。绝对期限从首次登录计算，轮换不延长。失效后重新登录。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/RefreshRequest'
    responses:
      '200':
        description: 刷新成功
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/AuthSession'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

logout:
  post:
    operationId: LogoutAuth
    summary: 登出并撤销刷新令牌
    description: |
      撤销当前认证用户提交的 refresh token 所属整条会话链，包含已轮换后继，不影响其他独立登录会话。本人已撤销的 token 再次提交返回 204；
      他人的 token（包括已撤销的 token）返回 403 且不修改。未知 token 保持 401 token-invalid 错误，
      响应不包含 token 所属信息。数据库中仍存在的本人过期 refresh token 也可撤销。
      已签发的 access token 在到期前仍可能有效，不承诺全设备退出或即时撤销 access token。
      调用方在协调刷新后必须使用最新的 access 和 refresh token 重新构建登出请求。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/LogoutRequest'
    responses:
      '204':
        description: 提交的本人 refresh token 已撤销，或此前已撤销。
      '400':
        $ref: '../base.yaml#/components/responses/Problem'
      '401':
        $ref: '../base.yaml#/components/responses/Problem'
      '403':
        $ref: '../base.yaml#/components/responses/Problem'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
