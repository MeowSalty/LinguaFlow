operations:
  get:
    operationId: ListOperations
    summary: 按项目权限发现翻译与术语同步任务
    description: |
      只读投影，不新增通用任务实体。默认返回两类活动任务，组织成员可看到同项目其他成员的任务。
      未授权或不存在的显式 project_id 返回空列表，系统管理员无额外跨项目权限。
      state 默认 active，与 status 互斥；同步没有 paused。trigger_type 仅允许显式 task_type=translation。
      updated_at 区间为 [updated_from, updated_before)，按 updated_at DESC, task_type DESC, 整数 task_id DESC 排序。
      独立版本化游标绑定规范化筛选（不含 limit）；不可使用 Job 游标。每页重新鉴权，不提供跨请求快照。
      刷新从第一页开始并处理全部续页，客户端以 (task_type,task_id) 去重，单页缺失不代表任务结束。
      未知、重复、空或非法参数均返回 400。开始时间未知为 null，不返回 ETA、配置、段落或资源 ID 数组、错误正文和全实例队列。
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/taskType'
      - $ref: './jobs.yaml#/jobProjectFilter'
      - $ref: './jobs.yaml#/jobTriggerFilter'
      - name: state
        in: query
        schema:
          type: string
          enum: [active, terminal, all]
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, running, paused, completed, failed, cancelled]
      - name: updated_from
        in: query
        schema:
          type: string
          format: date-time
      - name: updated_before
        in: query
        schema:
          type: string
          format: date-time
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
    responses:
      '200':
        description: 轻量任务分页
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operation.yaml#/OperationListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

operationsSummary:
  get:
    operationId: GetOperationsSummary
    summary: 获取两类任务的独立数量摘要
    description: |
      只允许 task_type、project_id、trigger_type；trigger_type 仅允许显式 task_type=translation。
      未知、重复、空或非法参数返回 400。权限与列表一致，无权项目返回零。
      by_type 固定返回两类，未选类型计零，同步 paused 恒为零；total 为逐字段求和。
      recent_failed 只数当前 failed 且 updated_at 位于 [recent_failed_since,as_of) 的记录，窗口为连续七天。
      活动数不受时间限制；不受分页影响，不代表历史失败事件次数。
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/taskType'
      - $ref: './jobs.yaml#/jobProjectFilter'
      - $ref: './jobs.yaml#/jobTriggerFilter'
    responses:
      '200':
        description: 数量摘要
        content:
          application/json:
            schema:
              $ref: '../components/schemas/operation.yaml#/OperationsSummaryResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

taskType:
  name: task_type
  in: query
  schema:
    type: string
    enum: [translation, glossary_sync]
