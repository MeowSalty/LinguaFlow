quickTranslate:
  post:
    operationId: QuickTranslate
    summary: 即时翻译（类 Google Translate 的单段在线翻译，译文纯临时不落库）
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/quick-translate.yaml#/QuickTranslateRequest'
    responses:
      '200':
        description: 即时翻译结果
        content:
          application/json:
            schema:
              $ref: '../components/schemas/quick-translate.yaml#/QuickTranslateResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
