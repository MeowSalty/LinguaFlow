executionPlanTemplates:
  get:
    description: 不传 org_id 时返回个人及当前所属组织的计划；显式 org_id 时仅返回该组织对象，要求当前成员资格。拒绝未知、重复、空值和非法查询参数。
    parameters:
      - name: org_id
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 组织不存在返回 404，非成员返回 403。
    operationId: ListExecutionPlanTemplates
    summary: 列出当前用户的执行计划模板
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 执行计划模板列表
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-plan-template.yaml#/ExecutionPlanTemplateListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: CreateExecutionPlanTemplate
    summary: 创建执行计划模板
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/execution-plan-template.yaml#/CreateExecutionPlanTemplateRequest'
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-plan-template.yaml#/ExecutionPlanTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

executionPlanTemplateById:
  parameters:
    - $ref: '../base.yaml#/components/parameters/ExecutionPlanTemplateId'
  get:
    operationId: GetExecutionPlanTemplate
    summary: 获取执行计划模板详情
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 执行计划模板详情
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-plan-template.yaml#/ExecutionPlanTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  put:
    operationId: UpdateExecutionPlanTemplate
    summary: 更新执行计划模板
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/execution-plan-template.yaml#/UpdateExecutionPlanTemplateRequest'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '../components/schemas/execution-plan-template.yaml#/ExecutionPlanTemplate'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  delete:
    operationId: DeleteExecutionPlanTemplate
    summary: 删除执行计划模板
    security:
      - bearerAuth: []
    responses:
      '204':
        description: 删除成功
      default:
        $ref: '../base.yaml#/components/responses/Problem'
