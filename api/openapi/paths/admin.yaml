adminSettings:
  get:
    operationId: AdminGetSettings
    summary: 获取系统配置
    description: 返回数据库权威政策。设置缺失、损坏或读取故障返回 503。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 系统配置
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/SystemSettingsResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  patch:
    operationId: AdminUpdateSettings
    summary: 更新系统配置
    description: |
      settings 至少提交一个支持字段，未提交字段保持不变；拒绝未知字段、null 和错误类型。
      task_retention 必须完整提交 enabled、retention_days 和 expected_revision，禁止提交 revision。
      同时修改多个政策时全部提交或全部回滚。版本不一致返回 409 settings_conflict。
      政策值没有变化时不递增版本、不重复记录审计；保存后无需重启，维护期间仍可修改政策。
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/UpdateSystemSettingsRequest'
    responses:
      '200':
        description: 更新后的系统配置
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/SystemSettingsResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
