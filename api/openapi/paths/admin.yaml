adminRuntimeSummary:
  get:
    operationId: AdminGetRuntimeSummary
    summary: 当前实例运行容量与负载
    description: |
      仅当前系统管理员可读，组织角色不授予访问权；本地模式使用真实管理员身份。
      不接受任何查询参数（认证使用 Authorization header）。未认证 401、无系统权限 403、非法查询 400。
      collector 缺失返回 503 Problem，单 runner 恢复失败返回 200 和 degraded。
      指标来自进程内存，不读写业务数量表。组件内部一致，跨组件近同时采样。
      instance_id 每次 Server 运行随机生成；重启累计清零，不可拼接不同实例增量。
      不含租户、任务、backend、模型、URL、凭据、路径或原始错误。
    security:
      - bearerAuth: []
    responses:
      '200':
        description: 当前实例快照
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
        content:
          application/json:
            schema:
              $ref: '../components/schemas/runtime.yaml#/RuntimeSummary'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

adminUsers:
  get:
    operationId: AdminListUsers
    summary: 列出所有用户
    security:
      - bearerAuth: []
    parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '../base.yaml#/components/parameters/Cursor'
      - $ref: '../base.yaml#/components/parameters/Limit'
    responses:
      '200':
        description: 用户列表
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/AdminUserListResponse'
      default:
        $ref: '../base.yaml#/components/responses/Problem'
  post:
    operationId: AdminCreateUser
    summary: 创建用户
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../base.yaml#/components/schemas/AdminCreateUserRequest'
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              $ref: '../base.yaml#/components/schemas/User'
      default:
        $ref: '../base.yaml#/components/responses/Problem'

