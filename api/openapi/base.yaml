openapi: 3.0.3
info:
  title: LinguaFlow Web Service API
  version: 0.1.0
  description: |
    平台时间点使用 UTC。所有 date-time 响应（包括 SSE 事件）使用 RFC3339 的 Z 后缀，
    保留有效小数秒；输入接受带时区偏移的 RFC3339，并按实际时间点解释。
    SQLite 保留纳秒精度，PostgreSQL 保留微秒精度。空值和字段省略规则由各字段定义。
    时间区间默认按接口声明解释；任务更新时间筛选使用左闭右开区间。
    根路径 /metrics 为系统管理员认证的持久化数量兼容入口，保留原文本格式；
    实时运行监控使用 /api/v1/admin/runtime/summary。外部抓取方须携带管理员认证。
    存储部署能力合同 E01：能力和管理动作是只读快照；部署拒绝使用
    storage_deployment_disabled（409，无 Retry-After），政策违规保持 403。
    旧 byos_disabled 原因仅保留枚举兼容；客户端须按具体操作重新发现能力。
