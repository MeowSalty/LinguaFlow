RegisterRequest:
  type: object
  required: [username, password, email]
  properties:
    username:
      type: string
    password:
      type: string
      minLength: 8
      description: 至少 8 个 Unicode 码点、最多 72 个 UTF-8 字节；原样校验和哈希，不去除空白或截断。字节上限不能用按字符计数的 maxLength 代替。
    email:
      type: string
      format: email
    display_name:
      type: string

LoginRequest:
  type: object
  required: [username, password]
  properties:
    username:
      type: string
    password:
      type: string
      description: 原样验证密码，不施加注册或改密时的新密码长度规则，以兼容历史密码。

RefreshRequest:
  type: object
  required: [refresh_token]
  properties:
    refresh_token:
      type: string

LogoutRequest:
  type: object
  additionalProperties: false
  required: [refresh_token]
  properties:
    refresh_token:
      type: string
      description: 当前认证用户本人持有的 refresh token；只撤销此 token，不影响其他会话。

AuthSession:
  type: object
  required: [access_token, refresh_token, token_type, expires_at, refresh_expires_at, user]
  properties:
    access_token:
      type: string
    refresh_token:
      type: string
    token_type:
      type: string
    expires_at:
      type: string
      format: date-time
    refresh_expires_at:
      type: string
      format: date-time
    user:
      $ref: './user.yaml#/User'
