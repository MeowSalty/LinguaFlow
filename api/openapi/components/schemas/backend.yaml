ResponseFormat:
  type: string
  enum: [json_schema, json_object, text, none]
  default: json_schema
  description: |
    响应格式：
    - json_schema: 强制结构化 JSON 输出（推荐）
    - json_object: 自由 JSON 对象
    - text: 纯文本
    - none: 不约束格式

ThinkingLevel:
  type: string
  enum: [off, minimal, low, medium, high]
  description: |
    统一思考强度档位（手动开关式）。不设置该键 = 开关关闭，不传任何 thinking 字段，
    沿用模型/网关默认（注意：默认开思考的推理模型在不设置该键时仍会思考，此为 by design）。
    off = 开关开启且显式关闭思考，映射为各协议原生关闭参数
    （OpenAI reasoning_effort "none" / Anthropic thinking disabled / Gemini thinkingBudget 0），
    该参数的模型兼容性由用户自行保证，LinguaFlow 不做模型能力校验。
    minimal = 开关开启并选择最低档位，映射为各协议原生最低档参数
    （OpenAI reasoning_effort "minimal" / Anthropic budget_tokens ≈ max_tokens 的 12.5% / Gemini ThinkingLevel "MINIMAL"）。
    minimal/low/medium/high = 开关开启并选择档位，由各适配层映射为厂商原生参数。仅对支持推理的模型生效。

OpenAIBackendOptions:
  type: object
  required: [api_key, type, model]
  description: OpenAI 兼容后端选项。支持 OpenAI 官方 API 及 Azure OpenAI、Ollama、LM Studio 等兼容服务。
  properties:
    type:
      type: string
    api_key:
      type: string
      description: AI 服务 API 密钥
    base_url:
      type: string
      description: |
        自定义API端点URL。留空使用默认值。
        可用于指向 Azure OpenAI / Ollama / LM Studio / 自定义网关等兼容服务。
    model:
      type: string
      minLength: 1
      description: 模型名称（必填）。须为所选服务实际可用的模型 ID。
    max_tokens:
      type: integer
      minimum: 0
      default: 0
      description: 最大生成 token 数。0 表示不限制。
    timeout:
      type: integer
      minimum: 0
      default: 60
      description: 请求超时时间（秒）。0 表示不限制。
    response_format:
      $ref: '#/ResponseFormat'
    temperature:
      type: number
      format: double
      minimum: 0
      maximum: 2
      description: |
        采样温度，控制输出的随机性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 0: 确定性输出（greedy decoding）
        - 0.1-0.3: 翻译任务推荐范围
        - 0.7-1.0: 创意写作
    top_p:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: |
        核采样参数，控制采样多样性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 1.0: 不限制
        - 0.9: 仅考虑累积概率前 90% 的 token
    stream:
      type: boolean
      default: false
      description: |
        设为 true 时以流式发起请求并在内部累积为完整响应后返回，
        适用于只接受 stream:true 的兼容网关。默认 false。
    thinking_level:
      $ref: '#/ThinkingLevel'
      description: |
        思考强度档位（统一语义）。不设置=开关关闭，不传 reasoning_effort（沿用模型/网关默认）；
        off=显式关闭（reasoning_effort "none"）；minimal/low/medium/high 映射为对应档位。

AnthropicBackendOptions:
  type: object
  required: [api_key, type, model]
  description: Anthropic Claude 后端选项。
  properties:
    type:
      type: string
    api_key:
      type: string
      description: AI 服务 API 密钥
    base_url:
      type: string
      description: |
        自定义API端点URL。留空使用默认值。
    model:
      type: string
      minLength: 1
      description: 模型名称（必填）。须为 Anthropic 实际可用的模型 ID。
    max_tokens:
      type: integer
      minimum: 1
      default: 8192
      description: 最大生成 token 数。Anthropic 必填，默认 8192。
    timeout:
      type: integer
      minimum: 0
      default: 60
      description: 请求超时时间（秒）。0 表示不限制。
    response_format:
      $ref: '#/ResponseFormat'
    temperature:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: |
        采样温度，控制输出的随机性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 0: 确定性输出
        - 0.1-0.3: 翻译任务推荐范围
        - Anthropic范围限制为0-1
    top_p:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: |
        核采样参数，控制采样多样性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 1.0: 不限制
    enable_prompt_cache:
      type: boolean
      default: true
      description: |
        启用提示缓存（Prompt Caching）。
        启用后，system prompt会被标记为ephemeral缓存断点，
        可显著降低重复翻译任务的token消耗和延迟。
    stream:
      type: boolean
      default: false
      description: |
        设为 true 时以流式发起请求并在内部累积为完整响应后返回，
        适用于只接受 stream:true 的兼容网关。默认 false。
    thinking_level:
      $ref: '#/ThinkingLevel'
      description: |
        思考强度档位（统一语义）。不设置=开关关闭，不传 thinking。
        仅 minimal/low/medium/high 时跳过 temperature/top_p（API 拒绝非默认采样参数）；
        显式 off 时 thinking 已禁用，temperature/top_p 正常传递。
        Anthropic 开启档位时 budget_tokens 与最终输出共用同一个 max_tokens 池
        （按 minimal/low/medium/high ≈ 12.5%/25%/50%/75% 切分给思考），
        默认 max_tokens 8192 时 minimal 恰为 1024 下限；更小的 max_tokens 会被钳制到
        1024 下限（此时与 low 同值）。
        请按需抬高 max_tokens 以同时容纳思考与批量翻译输出。

GoogleBackendOptions:
  type: object
  required: [api_key, type, model]
  description: Google Gemini 后端选项。
  properties:
    type:
      type: string
    api_key:
      type: string
      description: AI 服务 API 密钥
    base_url:
      type: string
      description: |
        自定义API端点URL。留空使用默认值。
    model:
      type: string
      minLength: 1
      description: 模型名称（必填）。须为 Google Gemini 实际可用的模型 ID。
    max_tokens:
      type: integer
      minimum: 1
      default: 8192
      description: 最大生成 token 数。默认 8192。
    timeout:
      type: integer
      minimum: 0
      default: 60
      description: 请求超时时间（秒）。0 表示不限制。
    response_format:
      $ref: '#/ResponseFormat'
    temperature:
      type: number
      format: double
      minimum: 0
      maximum: 2
      description: |
        采样温度，控制输出的随机性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 0: 确定性输出
        - 0.1-0.3: 翻译任务推荐范围
        - Google Gemini范围限制为0-2
    top_p:
      type: number
      format: double
      minimum: 0
      maximum: 1
      description: |
        核采样参数，控制采样多样性。
        - 不设置: 使用 API 默认值（通常为 1.0）
        - 1.0: 不限制
    stream:
      type: boolean
      default: false
      description: |
        设为 true 时以流式发起请求并在内部累积为完整响应后返回，
        适用于只接受 stream:true 的兼容网关。默认 false。
    thinking_level:
      $ref: '#/ThinkingLevel'
      description: |
        思考强度档位（统一语义）。不设置=开关关闭，不传 ThinkingConfig（沿用模型默认）；
        off=显式关闭（协议无 ThinkingLevel 关闭档，映射为 thinkingBudget 0）；
        minimal/low/medium/high 映射为对应档位。

BackendOptions:
  oneOf:
    - $ref: '#/OpenAIBackendOptions'
    - $ref: '#/AnthropicBackendOptions'
    - $ref: '#/GoogleBackendOptions'
  discriminator:
    propertyName: type
    mapping:
      openai: '#/OpenAIBackendOptions'
      anthropic: '#/AnthropicBackendOptions'
      google: '#/GoogleBackendOptions'

Backend:
  type: object
  required: [id, scope, name, type]
  properties:
    id:
      type: integer
    scope:
      type: string
      enum: [user, org]
    name:
      type: string
    type:
      type: string
      enum: [openai, anthropic, google]
    options:
      $ref: '#/BackendOptions'
    rate_limit_per_minute:
      type: integer
      minimum: 0
      default: 0
      description: 每分钟请求限制；0 表示不限速
    owner_user_id:
      type: integer
    owner_org_id:
      type: integer

BackendListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Backend'

CreateBackendRequest:
  type: object
  required: [name, type, options]
  properties:
    name:
      type: string
    type:
      type: string
      enum: [openai, anthropic, google]
    options:
      $ref: '#/BackendOptions'
    rate_limit_per_minute:
      type: integer
      minimum: 0
      default: 0
      description: 每分钟请求限制；0 表示不限速
  additionalProperties: false

UpdateBackendRequest:
  type: object
  required: [name, type, options]
  properties:
    name:
      type: string
    type:
      type: string
      enum: [openai, anthropic, google]
    options:
      $ref: '#/BackendOptions'
    rate_limit_per_minute:
      type: integer
      minimum: 0
      default: 0
      description: 每分钟请求限制；0 表示不限速
  additionalProperties: false

ListBackendModelsRequest:
  type: object
  required: [type, api_key]
  description: 凭用户输入的凭据探测可用模型列表（不落库）
  properties:
    type:
      type: string
      enum: [openai, anthropic, google]
      description: 后端类型
    api_key:
      type: string
      description: AI 服务 API 密钥
    base_url:
      type: string
      description: 自定义 API 端点 URL，留空使用默认值
  additionalProperties: false

BackendModel:
  type: object
  required: [id, name]
  description: 可用模型条目
  properties:
    id:
      type: string
      description: 模型 ID，可直接填入后端 options.model
    name:
      type: string
      description: 展示名；缺失时与 id 相同

BackendModelListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/BackendModel'
