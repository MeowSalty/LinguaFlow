Resource:
  type: object
  required: [id, path, name, directory, format, total_segments, translated_segments, approved_segments, created_at, updated_at]
  properties:
    id:
      type: integer
    path:
      type: string
      description: 项目内规范化资源相对路径，使用 / 分隔，例如 ui/common.json
    name:
      type: string
      description: 资源显示名，当前等同于资源路径 basename，预留给后续可编辑显示名
    directory:
      type: string
      description: 资源所在目录，根目录为空字符串
    format:
      type: string
    total_segments:
      type: integer
    translated_segments:
      type: integer
      description: 已翻译段落数（含 translated、edited、approved）
    approved_segments:
      type: integer
      description: 已审核通过段落数
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ResourceUploadFileResult:
  type: object
  required: [path, action]
  properties:
    path:
      type: string
      description: 资源项目内规范化相对路径
    action:
      type: string
      enum: [created, conflict, failed]
      description: 处理结果：created=创建成功，conflict=与已有资源冲突，failed=处理失败
    resource:
      $ref: '#/Resource'
      description: 创建成功时返回新资源
    existing_resource:
      $ref: '#/Resource'
      description: 冲突时返回已有资源
    error:
      type: string
      description: 失败时的错误信息

ResourceUploadBatchResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ResourceUploadFileResult'

ResourceListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Resource'

ResourceTreeNode:
  type: object
  required: [type, name, path]
  properties:
    type:
      type: string
      enum: [directory, resource]
    name:
      type: string
    path:
      type: string
      description: 目录或资源的项目内规范化相对路径，根目录为空字符串
    resource:
      $ref: '#/Resource'
    children:
      type: array
      items:
        $ref: '#/ResourceTreeNode'

ResourceTreeResponse:
  type: object
  required: [root]
  properties:
    root:
      $ref: '#/ResourceTreeNode'

ResourceSegment:
  allOf:
    - $ref: '../schemas/job.yaml#/Segment'

ResourceSegmentListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../schemas/job.yaml#/Segment'
    next_cursor:
      type: string
    total:
      type: integer
      description: 满足过滤条件的段落总数；仅当请求 include_total=true 时返回

ResourceSegmentUpdateRequest:
  type: object
  properties:
    source_text:
      type: string
    target_text:
      type: string
    comment:
      type: string
  additionalProperties: false

SegmentReviewRequest:
  type: object
  required: [action]
  properties:
    action:
      type: string
      enum: [approve, reject]
      description: 审核操作：approve=通过，reject=拒绝
    comment:
      type: string
      description: 审核备注

BatchReviewRequest:
  type: object
  required: [segment_ids, action]
  properties:
    segment_ids:
      type: array
      items:
        type: integer
      minItems: 1
      description: 待审核的段落 ID 列表
    action:
      type: string
      enum: [approve, reject]
      description: 批量审核操作
    comment:
      type: string
      description: 审核备注

BatchReviewResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '../schemas/job.yaml#/Segment'

ApproveAllResponse:
  type: object
  required: [approved_count]
  properties:
    approved_count:
      type: integer
      description: 批准的段落数

RetranslateResponse:
  type: object
  required: [reset_count]
  properties:
    reset_count:
      type: integer
      description: 重置为待翻译的段落数

IncrementalUpdateChanges:
  type: object
  required: [added, updated, unchanged, deleted]
  properties:
    added:
      type: integer
      description: 新增段落数
    updated:
      type: integer
      description: 源文本变化的段落数
    unchanged:
      type: integer
      description: 未变化的段落数
    deleted:
      type: integer
      description: 删除的段落数

IncrementalUpdateResponse:
  type: object
  required: [resource, changes]
  properties:
    resource:
      $ref: '#/Resource'
    changes:
      $ref: '#/IncrementalUpdateChanges'

ResourcePrecheckFileResult:
  type: object
  required: [path, action]
  properties:
    path:
      type: string
      description: 资源项目内规范化相对路径
    action:
      type: string
      enum: [create, conflict, duplicate]
      description: 建议操作：create=可直接创建，conflict=与已有资源冲突，duplicate=批次内重复路径
    existing_resource:
      $ref: '#/Resource'
      description: 冲突时返回已有资源信息

ResourcePrecheckBatchResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ResourcePrecheckFileResult'

ResourceSegmentGroup:
  type: object
  required: [group_key, group_title, segment_count, translated_count, approved_count]
  properties:
    group_key:
      type: string
      description: 分组键（如 epub_file 路径）
    group_title:
      type: string
      description: 分组标题（如章节标题）
    segment_count:
      type: integer
      description: 该组的 segment 总数
    translated_count:
      type: integer
      description: 已翻译的 segment 数量
    approved_count:
      type: integer
      description: 已审核通过的 segment 数量

ResourceSegmentGroupListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ResourceSegmentGroup'

SegmentTranslationPreviewRequest:
  type: object
  required: [execution_plan_id]
  properties:
    execution_plan_id:
      type: integer
      minimum: 1
      description: 执行计划模板 ID；计划中必须至少包含一个 translate 轮次
    source_text:
      type: string
      description: |
        可选：编辑器中尚未保存的原文。省略时使用数据库原文；传入时必须为非空白文本，
        将作为本次预览的原文（模拟一次原文变更后执行计划）。
  additionalProperties: false

SegmentTranslationPreviewResponse:
  type: object
  required: [status, segment_id, source_text, execution, usage, batches]
  properties:
    status:
      type: string
      enum: [success, partial, failed]
      description: |
        - failed: 未得到非空最终译文或翻译轮终态失败
        - partial: 有最终译文，但 extract / adjudicate / semantic QA 有终态失败或软警告
        - success: 有最终译文且所有执行轮完成
    segment_id:
      type: integer
    source_text:
      type: string
      description: 实际进入预览的原文（数据库原文或请求覆盖值）
    target_text:
      type: string
      description: 最终译文；failed 时可能为空
    quality_issues:
      type: array
      items:
        $ref: '../schemas/job.yaml#/QualityIssue'
      description: 最终汇总的质量问题（翻译确定性 QA + adjudicate + semantic QA）
    execution:
      type: object
      required: [execution_plan_id, execution_plan_name, rounds]
      properties:
        execution_plan_id:
          type: integer
        execution_plan_name:
          type: string
        rounds:
          type: array
          description: 各轮执行摘要（不暴露 backend options）
          items:
            type: object
            required: [index, mode]
            properties:
              index:
                type: integer
              mode:
                type: string
                enum: [extract, translate, adjudicate, semantic_qa, revise, correct]
              backend_name:
                type: string
              prompt_template_name:
                type: string
                description: translate 轮的提示词模板名称
              profile_name:
                type: string
                description: translate 轮的策略模板名称
    usage:
      type: object
      required: [api_calls, input_tokens, output_tokens]
      properties:
        api_calls:
          type: integer
          description: 实际 provider 调用次数（覆盖 retry、prompt upgrade、ruby retry 及所有轮次）
        input_tokens:
          type: integer
        output_tokens:
          type: integer
    batches:
      type: array
      items:
        $ref: '#/TranslationBatchDiagnostic'
    warnings:
      type: array
      items:
        type: string
    apply_token:
      type: string
      description: 仅当存在可应用译文时返回；用于 apply 接口
    apply_expires_at:
      type: string
      format: date-time
      description: apply_token 的过期时间

TranslationBatchDiagnostic:
  type: object
  required: [stage, status]
  properties:
    round_index:
      type: integer
    stage:
      type: string
      description: extract | translate | adjudicate | semantic_qa | revise | ruby_retry
    attempt:
      type: integer
      description: 批次重试序号（0 起始）
    segment_ids:
      type: array
      items:
        type: string
      description: 文档段 ID（doc.Segments[idx].ID，对 Web 文档为 segment_index 字符串）
    segment_count:
      type: integer
    backend_name:
      type: string
    status:
      type: string
      enum: [success, partial, failed]
    duration_ms:
      type: integer
    input_tokens:
      type: integer
    output_tokens:
      type: integer
    request:
      type: object
      description: 发送给后端的请求诊断（不含 provider headers、API key 或 backend options）
      properties:
        system_prompt:
          type: string
        system_prompt_length:
          type: integer
        system_prompt_truncated:
          type: boolean
        user_message:
          type: string
        user_message_length:
          type: integer
        user_message_truncated:
          type: boolean
        response_format:
          type: string
          description: none | json_schema | json_object | ""（后端默认）
        json_schema:
          type: object
          additionalProperties: true
          description: 请求所附 JSON schema（按需）
    response:
      type: object
      properties:
        content:
          type: string
          description: 后端原始文本响应
        content_length:
          type: integer
        content_truncated:
          type: boolean
    used_glossary:
      type: array
      items:
        $ref: '../schemas/glossary.yaml#/GlossaryEntry'
    added_glossary:
      type: array
      items:
        $ref: '../schemas/glossary.yaml#/GlossaryEntry'
      description: 本批次抽取/自举新增的术语（仅写入内存 overlay）
    error_type:
      type: string
      description: backend_error | parse_error | placeholder_error | render_error
    error_message:
      type: string
    http_status:
      type: integer
    tried_backends:
      type: array
      items:
        type: string
    shrink_attempted:
      type: boolean
    truncated:
      type: boolean
      description: 后端响应因输出 token 上限被截断（finish_reason=MAX_TOKENS/length、stop_reason=max_tokens）；部分文本仍有效，已由修复链抢救完整前缀，缺失条目走重跑通道
    repaired:
      type: array
      items:
        type: string
      description: 响应解析修复算子链（如 json.close-braces、json.truncation-salvage），按应用顺序记录

ApplySegmentTranslationPreviewRequest:
  type: object
  required: [apply_token, target_text]
  properties:
    apply_token:
      type: string
      description: 翻译预览或修订预览返回的 apply_token
    target_text:
      type: string
      description: 预览后（可能被用户修改）的译文；为空将返回 400
  additionalProperties: false

SegmentRevisionPreviewRequest:
  type: object
  required: [execution_plan_id]
  properties:
    execution_plan_id:
      type: integer
      minimum: 1
      description: |
        执行计划模板 ID；计划须包含 revise 轮或至少一个 translate 轮
        （后者时以翻译轮后端合成默认修订轮）
    issue_codes:
      type: array
      minItems: 1
      items:
        type: string
        enum: [calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register]
      description: |
        可选：收窄修复目标的语义 issue code 子集；省略时修复段落上全部 pending 语义 issue。
        与段落实际 pending 语义 issue 取交集，交集为空返回 409。
  additionalProperties: false

SegmentRevisionPreviewResponse:
  type: object
  required: [status, segment_id, source_text, original_target_text, execution, usage, batches]
  properties:
    status:
      type: string
      enum: [success, partial, failed]
      description: |
        - failed: 未得到非空修订译文或修订轮终态失败
        - partial: 有修订译文，但修订轮有软警告
        - success: 修订轮完成（修订文本可能与原译文相同，表示 LLM 判定无需改动）
    segment_id:
      type: integer
    source_text:
      type: string
      description: 进入修订的原文（数据库原文）
    original_target_text:
      type: string
      description: 修订前的原译文（apply 基线）
    target_text:
      type: string
      description: 修订后译文；failed 时可能为空。与 original_target_text 相同表示无改动
    fix_issues:
      type: array
      items:
        $ref: '../schemas/job.yaml#/QualityIssue'
      description: 本次作为修复目标喂给修订 LLM 的语义 issue（过滤后子集）
    quality_issues:
      type: array
      items:
        $ref: '../schemas/job.yaml#/QualityIssue'
      description: 修订译文上的最终质量问题（确定性 QA 重跑后与既有裁决对账）
    execution:
      type: object
      required: [execution_plan_id, execution_plan_name, rounds]
      properties:
        execution_plan_id:
          type: integer
        execution_plan_name:
          type: string
        rounds:
          type: array
          description: 实际执行的修订轮摘要（不暴露 backend options）
          items:
            type: object
            required: [index, mode]
            properties:
              index:
                type: integer
              mode:
                type: string
                enum: [revise]
              backend_name:
                type: string
              synthesized:
                type: boolean
                description: true 表示计划无 revise 轮、由 translate 轮后端合成的默认修订轮
    usage:
      type: object
      required: [api_calls, input_tokens, output_tokens]
      properties:
        api_calls:
          type: integer
          description: 实际 provider 调用次数（覆盖 retry、prompt upgrade 及修订轮）
        input_tokens:
          type: integer
        output_tokens:
          type: integer
    batches:
      type: array
      items:
        $ref: '#/TranslationBatchDiagnostic'
    warnings:
      type: array
      items:
        type: string
    apply_token:
      type: string
      description: 仅当存在可应用修订译文时返回；用于 translation-preview/apply 接口
    apply_expires_at:
      type: string
      format: date-time
      description: apply_token 的过期时间

IssueDispositionRequest:
  type: object
  required: [code, matched_text, disposition]
  properties:
    code:
      type: string
      description: 问题代码
    matched_text:
      type: string
      description: 问题指纹的 matched_text（无 span 的 issue 传空串）
    disposition:
      type: string
      enum: [pending, dismissed]
      description: pending=撤销裁决（改回未决）；dismissed=判定不是问题
    note:
      type: string
      description: 裁决说明（可选）

SearchReplacePreviewItem:
  type: object
  required: [segment_id, segment_index, source_text, before, after, match_count]
  properties:
    segment_id:
      type: integer
    segment_index:
      type: integer
    source_text:
      type: string
    before:
      type: string
      description: 替换前译文
    after:
      type: string
      description: 替换后译文；replace_with 为空串时为删除结果
    match_count:
      type: integer
      description: 该段落内命中次数

SearchReplaceSkippedItem:
  type: object
  required: [segment_id, reason]
  properties:
    segment_id:
      type: integer
    reason:
      type: string
      enum: [no_longer_matches, empty_result, target_diverged]
      description: 跳过原因；no_longer_matches=apply 时当前译文已不含匹配，empty_result=替换后译文为空，target_diverged=undo 时该段已被后续编辑

SearchReplacePreviewRequest:
  type: object
  required: [find, replace_with]
  properties:
    find:
      type: string
      description: 查找文本；substring 模式按字面子串，regex 模式为 RE2 语法
    replace_with:
      type: string
      description: 替换文本；允许空串表示删除
    match_mode:
      type: string
      enum: [substring, regex]
      default: substring
    case_sensitive:
      type: boolean
      default: true
    whole_word:
      type: boolean
      default: false
    max_results:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: 返回样本上限
    status:
      type: string
      enum: [pending, translated, edited, approved, rejected]
    quality_issues:
      type: string
      enum: [has, none]
    quality_severity:
      type: string
      enum: [warning, error]
    quality_code:
      type: string
    group_key:
      type: string
    segment_ids:
      type: array
      items:
        type: integer
      minItems: 1
  additionalProperties: false

SearchReplacePreviewResponse:
  type: object
  required: [matched_segment_count, total_replacements, items]
  properties:
    matched_segment_count:
      type: integer
      description: 含至少一次命中的段落数（受影响段落面）
    total_replacements:
      type: integer
      description: 所有段落命中次数总和
    items:
      type: array
      items:
        $ref: '#/SearchReplacePreviewItem'

SearchReplaceApplyRequest:
  type: object
  required: [find, replace_with]
  properties:
    find:
      type: string
      description: 查找文本；须与预览一致才能命中相同段落
    replace_with:
      type: string
      description: 替换文本；允许空串表示删除
    match_mode:
      type: string
      enum: [substring, regex]
      default: substring
    case_sensitive:
      type: boolean
      default: true
    whole_word:
      type: boolean
      default: false
    segment_ids:
      type: array
      items:
        type: integer
      minItems: 1
      description: 可选，仅应用这些段落；省略=对该资源所有当前命中段落应用
  additionalProperties: false

SearchReplaceApplyResponse:
  type: object
  required: [operation_id, applied_count, skipped_count, items]
  properties:
    operation_id:
      type: string
      description: 本次替换的唯一标识，用于撤销
    applied_count:
      type: integer
    skipped_count:
      type: integer
    items:
      type: array
      items:
        $ref: '../schemas/job.yaml#/Segment'
      description: 应用成功的段落
    skipped:
      type: array
      items:
        $ref: '#/SearchReplaceSkippedItem'
      description: 跳过的段落及原因

SearchReplaceUndoResponse:
  type: object
  required: [undo_operation_id, undone_count, skipped_count, items]
  properties:
    undo_operation_id:
      type: string
      description: 本次撤销写入的新历史标识，可再撤销（=重做）
    undone_count:
      type: integer
    skipped_count:
      type: integer
    items:
      type: array
      items:
        $ref: '../schemas/job.yaml#/Segment'
      description: 撤销成功回滚的段落
    skipped:
      type: array
      items:
        $ref: '#/SearchReplaceSkippedItem'
      description: 跳过的段落及原因
