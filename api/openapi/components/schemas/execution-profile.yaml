ExecutionProfileScope:
  type: string
  enum: [user, org, system]

ProfileRubyConfig:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
    preserve_kinds:
      type: array
      items:
        type: string
        enum: [phonetic, semantic, creative]
      default: [creative]
      description: 保留的注音分类列表

ProfileProtectConfig:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
    rules:
      type: array
      items:
        type: string
        enum: [code, link, placeholder, xml]

ProfilePostprocessConfig:
  type: object
  required: [enabled, trim_spaces]
  properties:
    enabled:
      type: boolean
    trim_spaces:
      type: boolean

ProfileRepairConfig:
  type: object
  required: [enabled, json_structural, schema_aliases, placeholder_normalize, prompt_upgrade]
  properties:
    enabled:
      type: boolean
    json_structural:
      type: boolean
    schema_aliases:
      type: boolean
    placeholder_normalize:
      type: boolean
    prompt_upgrade:
      type: boolean

ProfileBootstrapConfig:
  type: object
  required: [enabled, max_terms_per_1000_chars, min_source_len, inline_conflict_strategy]
  properties:
    enabled:
      type: boolean
      default: false
      description: 是否启用内联自举
    max_terms_per_1000_chars:
      type: number
      format: double
      minimum: 0
      description: 每 1000 源文字符（rune）最多抽取的术语条数（缩放系数）
    min_source_len:
      type: integer
      minimum: 1
      description: 内联自举术语源文最短字符数
    inline_conflict_strategy:
      type: string
      enum: [off, rewrite-local]
      description: 并发术语冲突处理策略

ProfileGlossaryConfig:
  type: object
  required: [bootstrap]
  properties:
    bootstrap:
      $ref: '#/ProfileBootstrapConfig'

ProfileContextConfig:
  type: object
  required: [enabled, before, after, max_chars]
  properties:
    enabled:
      type: boolean
      default: true
      description: 是否启用上下文窗口
    before:
      type: integer
      minimum: 0
      default: 1
      description: 上下文取前 N 段
    after:
      type: integer
      minimum: 0
      default: 1
      description: 上下文取后 N 段
    max_chars:
      type: integer
      minimum: 0
      default: 0
      description: 每个上下文段落的字符数上限（按 rune 计，超限截断并补省略号）；0 表示不限制

ProfileQAConfig:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
      default: false
      description: 是否启用翻译质量检测
    auto_reject:
      type: boolean
      default: false
      description: error 级别问题自动 reject；untranslated 例外——源语与目标语共用文字系统时降为 warning，该类"译文与原文相同"的段落不会被自动 reject
    checks:
      type: array
      items:
        type: string
      description: "启用的确定性 checker 名称；省略表示全部开启。可用值：untranslated、length_ratio、duplicate、source_residual、punctuation_pairing、punctuation_missing、punctuation_surplus、punctuation_wrap_loss、whitespace_irregular、repeated_space、width_mix、script_mismatch、number_mismatch、url_email_mismatch、subtitle_line_count、forbidden_term、term_inconsistency、leftover_placeholder、xml_tag_mismatch、duplicate_source_divergence"
    length_method:
      type: string
      enum: [char_weight, word_count]
      default: char_weight
      description: "长度计算方式。char_weight: CJK 字符×2 拉丁字符×1；word_count: CJK 每字 1 词拉丁每词 1 词"
    length_ratio_min:
      type: number
      format: double
      minimum: 0
      default: 0.2
      description: "译文/原文最短长度比，0 表示不检测"
    length_ratio_max:
      type: number
      format: double
      minimum: 0
      default: 3
      description: "译文/原文最长长度比，0 表示不检测"

ExecutionProfileConfig:
  type: object
  required: [schema_version, protect, postprocess, repair, glossary, context]
  properties:
    schema_version:
      type: integer
      enum: [1]
      default: 1
    protect:
      $ref: '#/ProfileProtectConfig'
    ruby:
      $ref: '#/ProfileRubyConfig'
    postprocess:
      $ref: '#/ProfilePostprocessConfig'
    repair:
      $ref: '#/ProfileRepairConfig'
    glossary:
      $ref: '#/ProfileGlossaryConfig'
    context:
      $ref: '#/ProfileContextConfig'
    qa:
      $ref: '#/ProfileQAConfig'

ExecutionProfile:
  type: object
  required: [id, name, description, scope, config]
  properties:
    id:
      type: integer
    name:
      type: string
    description:
      type: string
    scope:
      $ref: '#/ExecutionProfileScope'
    owner_user_id:
      type: integer
    owner_org_id:
      type: integer
    config:
      $ref: '#/ExecutionProfileConfig'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ExecutionProfileListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ExecutionProfile'

CreateExecutionProfileRequest:
  type: object
  description: 省略 org_id 创建个人对象；指定组织时必须为 admin/owner。归属不可更新，组织共享依赖只允许同组织或系统对象。
  required: [name]
  properties:
    org_id:
      type: integer
      minimum: 1
    name:
      type: string
    description:
      type: string
    config:
      $ref: '#/ExecutionProfileConfigInput'
  additionalProperties: false

UpdateExecutionProfileRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    config:
      $ref: '#/ExecutionProfileConfigInput'
  additionalProperties: false

