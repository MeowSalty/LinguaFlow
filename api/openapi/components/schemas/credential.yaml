CredentialBinding:
  type: object
  required: [id, version]
  additionalProperties: false
  properties:
    id:
      type: integer
      minimum: 1
    version:
      type: integer
      minimum: 1

Credential:
  type: object
  required: [id, scope, owner_id, provider, endpoint, current_version]
  properties:
    id:
      type: integer
    scope:
      type: string
      enum: [user, org]
    owner_id:
      type: integer
    provider:
      type: string
      enum: [openai, anthropic, google]
    endpoint:
      type: string
      description: 不可变的规范化 base URL；版本密钥仅可发送到其范围内。
    current_version:
      type: integer
      minimum: 1

CreateCredentialRequest:
  type: object
  additionalProperties: false
  required: [provider, secret]
  properties:
    provider:
      type: string
      enum: [openai, anthropic, google]
    endpoint:
      type: string
      description: 留空使用 provider 的明确默认端点。
    secret:
      type: string
      minLength: 1
      writeOnly: true

RotateCredentialRequest:
  type: object
  additionalProperties: false
  required: [secret]
  properties:
    secret:
      type: string
      minLength: 1
      writeOnly: true

CredentialVersion:
  type: object
  required: [version, revoked, created_at]
  properties:
    version:
      type: integer
    revoked:
      type: boolean
    created_at:
      type: string
      format: date-time

CredentialList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Credential'

CredentialVersionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/CredentialVersion'
