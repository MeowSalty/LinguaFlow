Project:
  type: object
  required: [id, name, source_lang, target_lang, glossary_enabled]
  properties:
    storage_space_id:
      type: integer
      nullable: true
    storage_generation:
      type: integer
      format: int64
    output_generation:
      type: integer
      format: int64
    storage_state:
      type: string

    id:
      type: integer
    name:
      type: string
    owner_user_id:
      type: integer
    owner_org_id:
      type: integer
    config:
      type: object
      additionalProperties: true
    glossary_enabled:
      type: boolean
      default: false
      description: 是否启用术语表
    source_lang:
      type: string
    target_lang:
      type: string
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ProjectListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Project'

CreateProjectRequest:
  type: object
  required: [name]
  properties:
    storage_space_id:
      type: integer
      minimum: 1

    name:
      type: string
    config:
      type: object
      additionalProperties: true
    glossary_enabled:
      type: boolean
      default: false
      description: 是否启用术语表
    source_lang:
      type: string
    target_lang:
      type: string
  additionalProperties: false

UpdateProjectRequest:
  type: object
  properties:
    name:
      type: string
    config:
      type: object
      additionalProperties: true
    glossary_enabled:
      type: boolean
      description: 是否启用术语表
    source_lang:
      type: string
    target_lang:
      type: string
  additionalProperties: false
