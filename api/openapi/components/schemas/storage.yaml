      type: "string"
    scope:
      type: "string"
      enum:
        - "site"
        - "user"
        - "org"
    status:
      type: "string"
    historical:
      type: "boolean"
    owner_id:
      type: "integer"
      minimum: 0
ProjectStorage:
  type: "object"
  additionalProperties: false
  required:
    - "project_id"
    - "storage_generation"
    - "storage_state"
    - "migration_task_id"
    - "binding"
    - "reason_codes"
  properties:
    project_id:
      type: "integer"
      minimum: 0
    storage_generation:
      type: "integer"
      minimum: 0
      format: "int64"
    storage_state:
      type: "string"
      enum:
        - "active"
        - "draining"
        - "migrating"
        - "legacy_migration"
        - "legacy_rollback"
    migration_task_id:
      type: "integer"
      minimum: 0
      nullable: true
    binding:
      type: "object"
      additionalProperties: false
