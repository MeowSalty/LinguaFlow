        - "space_id"
        - "name"
        - "scope"
        - "status"
        - "historical"
        - "owner_id"
      properties:
        space_id:
          type: "integer"
          minimum: 0
        name:
          type: "string"
        scope:
          type: "string"
          enum:
            - "site"
            - "user"
            - "org"
        status:
          type: "string"
        historical:
          type: "boolean"
        owner_id:
          type: "integer"
          minimum: 0
      nullable: true
    reason_codes:
      type: "array"
      items:
        type: "string"
        enum:
          - "policy_disallowed"
          - "selection_required"
          - "byos_disabled"
          - "storage_maintenance"
          - "connection_disabled"
          - "storage_auth_required"
          - "storage_crypto_unavailable"
          - "storage_permission_denied"
          - "storage_unavailable"
          - "space_unverified"
          - "space_read_only"
          - "space_disabled"
          - "storage_quota_exceeded"
          - "storage_operation_in_progress"
          - "project_not_empty"
StorageCheckSpaceResult:
  type: "object"
