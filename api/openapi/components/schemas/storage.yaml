    space_id:
      type: "integer"
      minimum: 0
    status:
      type: "string"
    error_code:
      type: "string"
StorageCheck:
  type: "object"
  additionalProperties: false
  required:
    - "check_id"
    - "connection_id"
    - "mode"
    - "management_generation"
    - "created_at"
    - "completed_at"
    - "status"
    - "cleanup_status"
    - "accounted_bytes"
    - "authorization_activated"
    - "results"
  properties:
    check_id:
      type: "integer"
      minimum: 0
    connection_id:
      type: "integer"
      minimum: 0
    mode:
      type: "string"
    management_generation:
      type: "integer"
      minimum: 0
      format: "int64"
    created_at:
      type: "string"
      format: "date-time"
    completed_at:
      type: "string"
      format: "date-time"
      nullable: true
    status:
      type: "string"
    cleanup_status:
      type: "string"
      enum:
        - "cleanup_pending"
        - "running"
        - "blocked"
        - "done"
    error_code:
      type: "string"
    accounted_bytes:
      type: "integer"
      minimum: 0
      format: "int64"
    authorization_activated:
      type: "boolean"
    results:
      type: "array"
      items:
        $ref: "#/StorageCheckSpaceResult"
StorageCheckList:
  type: "object"
  additionalProperties: false
  required:
    - "items"
  properties:
    items:
      type: "array"
      items:
        $ref: "#/StorageCheck"
