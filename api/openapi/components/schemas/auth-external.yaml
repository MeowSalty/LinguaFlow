OAuth2ConnectionConfig:
  type: object
  additionalProperties: false
  required: [authorization_endpoint, token_endpoint, profile_endpoint, client_id, subject_mapping]
  properties:
    authorization_endpoint: {type: string, format: uri}
    token_endpoint: {type: string, format: uri}
    profile_endpoint: {type: string, format: uri}
    client_id: {type: string}
    client_auth_method:
      type: string
      enum: [client_secret_basic, client_secret_post]
      default: client_secret_basic
    scopes:
      type: array
      maxItems: 32
      default: []
      items: {type: string}
    subject_mapping:
      type: object
      additionalProperties: false
      required: [pointer, type]
      properties:
        pointer: {type: string, minLength: 1, maxLength: 1024}
        type: {type: string, enum: [string, integer]}
OIDCConnectionConfig:
  type: "object"
  additionalProperties: false
  required:
    - "issuer"
    - "client_id"
  properties:
    issuer:
      type: "string"
      format: "uri"
    client_id:
      type: "string"
    client_auth_method:
      type: "string"
      enum:
        - "client_secret_basic"
        - "client_secret_post"
      default: "client_secret_basic"
    scopes:
      type: "array"
      items:
        type: "string"
      default:
        - "openid"
        - "profile"
    userinfo_enabled:
      type: "boolean"
      default: true
AuthConnectionPolicy:
  type: "object"
  additionalProperties: false
  required:
    - "enabled"
    - "login_enabled"
    - "signup_enabled"
    - "link_enabled"
    - "login_rules"
    - "signup_rules"
    - "link_rules"
  properties:
    enabled:
      type: "boolean"
    login_enabled:
      type: "boolean"
    signup_enabled:
      type: "boolean"
    link_enabled:
      type: "boolean"
    login_rules:
      $ref: "./auth-rules.yaml#/AuthRuleSet"
    signup_rules:
      $ref: "./auth-rules.yaml#/AuthRuleSet"
    link_rules:
      $ref: "./auth-rules.yaml#/AuthRuleSet"
ExternalBrowserInput:
  type: "object"
  additionalProperties: false
  required:
    - "browser_challenge"
    - "completion_url"
  properties:
    browser_challenge:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: "SHA-256 base64url challenge of a browser-held random verifier; independent of upstream PKCE."
    completion_url:
      type: "string"
      format: "uri"
    return_to:
      type: "string"
      default: "/"
      description: "Validated application-relative path."
ExternalLinkStartRequest:
  type: "object"
  additionalProperties: false
  required:
    - "browser_challenge"
    - "completion_url"
    - "reauthentication_proof"
  properties:
    browser_challenge:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: "SHA-256 base64url challenge of a browser-held random verifier; independent of upstream PKCE."
    completion_url:
      type: "string"
      format: "uri"
    return_to:
      type: "string"
      default: "/"
      description: "Validated application-relative path."
    reauthentication_proof:
      type: "string"
ExternalStartResponse:
  type: "object"
  additionalProperties: false
  required:
    - "transaction_id"
    - "authorization_url"
    - "expires_at"
  properties:
    transaction_id:
      type: "string"
    authorization_url:
      type: "string"
      format: "uri"
    expires_at:
      type: "string"
      format: "date-time"
ExternalExchangeRequest:
  type: "object"
  additionalProperties: false
  required:
    - "ticket"
    - "verifier"
  properties:
    ticket:
      type: "string"
    verifier:
      type: "string"
      minLength: 43
      maxLength: 128
ExternalCompleteRequest:
  type: "object"
  additionalProperties: false
  required:
    - "confirmation_token"
    - "verifier"
  properties:
    confirmation_token:
      type: "string"
    verifier:
      type: "string"
      minLength: 43
      maxLength: 128
    initial_password:
      type: string
      writeOnly: true
      description: Required only for a signup confirmation requiring local_password; never accepted for an existing account or binding.
    username:
      $ref: "./auth.yaml#/UsernameInput"
    display_name:
      type: "string"
ExternalCancelRequest:
  type: "object"
  additionalProperties: false
  required:
    - "transaction_id"
    - "verifier"
  properties:
    transaction_id:
      type: "string"
    verifier:
      type: "string"
      minLength: 43
      maxLength: 128
ReauthenticationRequest:
  type: "object"
  additionalProperties: false
  required:
    - "method"
    - "action"
    - "target_id"
  properties:
    method:
      type: "string"
      enum:
        - "password"
        - "oidc"
    password:
      type: "string"
    binding_id:
      type: "integer"
      minimum: 1
    action:
      type: "string"
      enum:
        - "link"
        - "password_set"
        - "password_delete"
        - "unlink"
    target_id:
      type: "string"
    browser_challenge:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: "SHA-256 base64url challenge of a browser-held random verifier; independent of upstream PKCE."
    completion_url:
      type: "string"
      format: "uri"
    return_to:
      type: "string"
      default: "/"
      description: "Validated application-relative path."
ReauthenticationProofResponse:
  type: "object"
  additionalProperties: false
  required:
    - "reauthentication_proof"
    - "expires_at"
  properties:
    reauthentication_proof:
      type: "string"
    expires_at:
      type: "string"
      format: "date-time"
ExternalProfile:
  type: "object"
  additionalProperties: false
  required:
    - "connection_id"
    - "connection_name"
    - "external_display"
  properties:
    connection_id:
      type: "string"
    connection_name:
      type: "string"
    external_display:
      type: "string"
ExternalConfirmationResponse:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "confirmation_token"
    - "transaction_id"
    - "expires_at"
    - "profile"
    - "signup_requirements"
  properties:
    kind:
      type: "string"
      enum:
        - "signup_confirmation"
        - "link_confirmation"
    confirmation_token:
      type: "string"
    transaction_id:
      type: "string"
    expires_at:
      type: "string"
      format: "date-time"
    signup_requirements:
      type: array
      items: {type: string, enum: [local_password]}
      description: Empty for linking and signup with fresh authentication support.
    profile:
      $ref: "#/ExternalProfile"
ExternalSessionResponse:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "session"
  properties:
    kind:
      type: "string"
      enum:
        - "session"
    session:
      $ref: "./auth.yaml#/AuthSession"
ExternalProofResponse:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "reauthentication_proof"
    - "expires_at"
  properties:
    kind:
      type: "string"
      enum:
        - "reauthentication_proof"
    reauthentication_proof:
      type: "string"
    expires_at:
      type: "string"
      format: "date-time"
ExternalTestResponse:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "fresh_supported"
    - "connection_id"
    - "revision"
    - "attributes"
    - "rules"
  properties:
    attributes:
      type: object
      additionalProperties:
        $ref: "./auth-rules.yaml#/AuthAttributeValue"
    rules:
      $ref: "./auth-rules.yaml#/AuthRulesDiagnostics"
    kind:
      type: "string"
      enum:
        - "test_result"
    fresh_supported:
      type: "boolean"
    connection_id:
      type: "string"
    revision:
      type: "integer"
      format: "int64"
ExternalExchangeResponse:
  oneOf:
    -
      $ref: "#/ExternalSessionResponse"
    -
      $ref: "#/ExternalConfirmationResponse"
    -
      $ref: "#/ExternalProofResponse"
    -
      $ref: "#/ExternalTestResponse"
  discriminator:
    propertyName: "kind"
ExternalLinkedResponse:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "binding_id"
  properties:
    kind:
      type: "string"
      enum:
        - "linked"
    binding_id:
      type: "integer"
ExternalCompleteResponse:
  oneOf:
    -
      $ref: "#/ExternalSessionResponse"
    -
      $ref: "#/ExternalLinkedResponse"
  discriminator:
    propertyName: "kind"
InitialPasswordRequest:
  type: "object"
  additionalProperties: false
  required:
    - "reauthentication_proof"
    - "new_password"
  properties:
    reauthentication_proof:
      type: "string"
    new_password:
      $ref: "./auth.yaml#/RegisterRequest/properties/password"
SensitiveOperationRequest:
  type: "object"
  additionalProperties: false
  required:
    - "reauthentication_proof"
  properties:
    reauthentication_proof:
      type: "string"
PublicAuthConnection:
  type: "object"
  additionalProperties: false
  required:
    - "connection_id"
    - "display_name"
    - "description"
    - "display_order"
    - "can_login"
    - "can_signup"
    - "signup_requirements"
  properties:
    connection_id:
      type: "string"
    display_name:
      type: "string"
    description:
      type: "string"
    display_order:
      type: "integer"
    logo_url:
      type: "string"
      nullable: true
    can_login:
      type: "boolean"
    can_signup:
      type: "boolean"
    signup_requirements:
      type: "array"
      maxItems: 1
      items:
        type: "string"
        enum:
          - "local_password"
CreateAuthConnectionRequest:
  type: "object"
  additionalProperties: false
  required:
    - "kind"
    - "display_name"
  oneOf:
    - required: [oidc]
      properties:
        kind: {enum: [oidc]}
    - required: [oauth2]
      properties:
        kind: {enum: [generic_oauth2]}
  properties:
    kind:
      type: "string"
      enum:
        - "oidc"
        - "generic_oauth2"
    display_name:
      type: "string"
    description:
      type: "string"
    display_order:
      type: "integer"
    oidc:
      $ref: "#/OIDCConnectionConfig"
    oauth2:
      $ref: "#/OAuth2ConnectionConfig"
    client_secret:
      type: "string"
      writeOnly: true
UpdateAuthConnectionRequest:
  type: "object"
  additionalProperties: false
  required:
    - "expected_revision"
  properties:
    attribute_mappings:
      type: array
      maxItems: 64
      items:
        $ref: './auth-rules.yaml#/AuthAttributeField'
    evidence_max_age_seconds:
      type: integer
      minimum: 1
      maximum: 31536000
      default: 3600
      description: Attribute evidence lifetime; applies to sessions only when login rules use attributes. Rotation never extends this deadline.
    expected_revision:
      type: "integer"
      format: "int64"
    display_name:
      type: "string"
    description:
      type: "string"
    display_order:
      type: "integer"
    oidc:
      $ref: "#/OIDCConnectionConfig"
    oauth2:
      $ref: "#/OAuth2ConnectionConfig"
    client_secret:
      type: "string"
      nullable: true
      writeOnly: true
      description: "Omitted keeps the current secret; null clears it; a nonempty string creates a new encrypted version."
    policy:
      $ref: "#/AuthConnectionPolicy"
AuthConnectionRevisionRequest:
  type: "object"
  additionalProperties: false
  required:
    - "expected_revision"
  properties:
    expected_revision:
      type: "integer"
      format: "int64"
AuthConnectionTestRequest:
  type: "object"
  additionalProperties: false
  required:
    - "expected_revision"
    - "browser_challenge"
    - "completion_url"
  properties:
    expected_revision:
      type: "integer"
      format: "int64"
    browser_challenge:
      type: "string"
      pattern: "^[A-Za-z0-9_-]{43}$"
      description: "SHA-256 base64url challenge of a browser-held random verifier; independent of upstream PKCE."
    completion_url:
      type: "string"
      format: "uri"
    return_to:
      type: "string"
      default: "/"
      description: "Validated application-relative path."
AuthConnectionSnapshot:
  type: "object"
  additionalProperties: false
  required:
    - "display_name"
    - "description"
    - "display_order"
    - "revision"
    - "policy"
    - "has_client_secret"
  properties:
    login_policy_revision: {type: integer, format: int64}
    attribute_mappings:
      type: array
      maxItems: 64
      items:
        $ref: './auth-rules.yaml#/AuthAttributeField'
    evidence_max_age_seconds:
      type: integer
      minimum: 1
      maximum: 31536000
      default: 3600
      description: Attribute evidence lifetime; applies to sessions only when login rules use attributes. Rotation never extends this deadline.
    display_name:
      type: "string"
    description:
      type: "string"
    display_order:
      type: "integer"
    oidc:
      $ref: "#/OIDCConnectionConfig"
    oauth2:
      $ref: "#/OAuth2ConnectionConfig"
    revision:
      type: "integer"
      format: "int64"
    policy:
      $ref: "#/AuthConnectionPolicy"
    has_client_secret:
      type: "boolean"
    logo_url:
      type: "string"
      nullable: true
AuthConnectionValidation:
  type: "object"
  additionalProperties: false
  required:
    - "fresh_supported"
    - "fingerprint_matches"
  properties:
    fresh_supported:
      type: "boolean"
    fingerprint_matches:
      type: "boolean"
    tested_at:
      type: "string"
      format: "date-time"
      nullable: true
AuthConnectionRecord:
  type: "object"
  additionalProperties: false
  required:
    - "id"
    - "kind"
    - "aggregate_revision"
    - "archived"
    - "has_client_secret"
  properties:
    identity_authority_id:
      type: string
      readOnly: true
      nullable: true
      description: Server-assigned immutable namespace for a generic OAuth connection.
    id:
      type: "string"
    kind:
      type: "string"
      enum:
        - "password"
        - "oidc"
        - "generic_oauth2"
    aggregate_revision:
      type: "integer"
      format: "int64"
    draft_revision:
      type: "integer"
      format: "int64"
      nullable: true
    published_revision:
      type: "integer"
      format: "int64"
      nullable: true
    archived:
      type: "boolean"
    has_client_secret:
      type: "boolean"
    draft:
      $ref: "#/AuthConnectionSnapshot"
    published:
      $ref: "#/AuthConnectionSnapshot"
    validation:
      $ref: "#/AuthConnectionValidation"
AuthConnectionsResponse:
  type: "object"
  additionalProperties: false
  required:
    - "items"
  properties:
    items:
      type: "array"
      items:
        $ref: "#/AuthConnectionRecord"
AuthConnectionCheck:
  type: "object"
  additionalProperties: false
  required:
    - "valid"
    - "fresh_supported"
    - "issues"
    - "revision"
    - "rules"
  properties:
    revision: {type: integer, format: int64}
    rules:
      $ref: "./auth-rules.yaml#/AuthRulesDiagnostics"
    valid:
      type: "boolean"
    fresh_supported:
      type: "boolean"
    issues:
      type: "array"
      items:
        type: "string"
AuthConnectionImpact:
  type: "object"
  additionalProperties: false
  required:
    - "affected_users"
    - "blocked_users"
    - "affected_sessions"
    - "can_publish"
  properties:
    revision: {type: integer, format: int64}
    evaluated_at: {type: string, format: date-time}
    remediation: {type: string}
    pass_users:
      type: array
      items: {type: integer}
    fail_users:
      type: array
      items: {type: integer}
    unknown_users:
      type: array
      items: {type: integer}
    administrator_users:
      type: array
      items: {type: integer}
    affected_users:
      type: "array"
      items:
        type: "integer"
    blocked_users:
      type: "array"
      items:
        type: "integer"
    affected_sessions:
      type: "integer"
    can_publish:
      type: "boolean"
LoginMethod:
  type: "object"
  additionalProperties: false
  required:
    - "binding_id"
    - "connection_id"
    - "display_name"
    - "can_login"
    - "can_reauthenticate"
    - "can_unlink"
    - "verified"
    - "archived"
  properties:
    login_rule_status: {type: string, enum: [pass, fail, unknown]}
    evidence_expires_at: {type: string, format: date-time}
    binding_id:
      type: "integer"
    connection_id:
      type: "string"
    display_name:
      type: "string"
    can_login:
      type: "boolean"
    can_reauthenticate:
      type: "boolean"
    can_unlink:
      type: "boolean"
    verified:
      type: "boolean"
    archived:
      type: "boolean"
LoginMethodsResponse:
  type: "object"
  additionalProperties: false
  required:
    - "password"
    - "email"
    - "bindings"
    - "available_connections"
  properties:
    password:
      type: "object"
      additionalProperties: false
      required:
        - "is_set"
        - "can_login"
        - "can_set"
        - "can_delete"
        - "verified"
      properties:
        verified:
          type: boolean
          description: Current password has been used successfully for login or reauthentication under an enabled password policy.
        is_set:
          type: "boolean"
        can_login:
          type: "boolean"
        can_set:
          type: "boolean"
        can_delete:
          type: "boolean"
    email:
      type: "object"
      additionalProperties: false
      required:
        - "address"
        - "verified"
        - "can_recover"
      properties:
        address:
          type: "string"
          nullable: true
        verified:
          type: "boolean"
        can_recover:
          type: "boolean"
    bindings:
      type: "array"
      items:
        $ref: "#/LoginMethod"
    available_connections:
      type: "array"
      items:
        $ref: "#/AvailableLoginConnection"
AvailableLoginConnection:
  type: "object"
  additionalProperties: false
  required: [connection_id, display_name, can_link]
  properties:
    connection_id:
      type: "string"
    display_name:
      type: "string"
    can_link:
      type: "boolean"
    logo_url:
      type: "string"
      nullable: true
