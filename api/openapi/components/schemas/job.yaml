CreateJobRequest:
  type: object
  required: [execution_plan_id]
  properties:
    execution_plan_id:
      type: integer
      description: 执行计划模板 ID
    resource_ids:
      type: array
      items:
        type: integer
        minimum: 1
    segment_ids:
      type: array
      items:
        type: integer
        minimum: 1
    segment_group_keys:
      type: array
      items:
        type: string
      description: |
        按章节分组键选择 segments（仅适用于 EPUB 等多章节资源）。
        传入 meta.epub_file 值（如 ["OEBPS/chapter1.xhtml"]），后端自动解析为对应的 segment_ids。
        与 segment_ids 互斥，优先级：segment_group_keys > segment_ids > resource_ids。
    segment_filter:
      type: string
      enum: [pending_only, skip_approved, all]
      description: |
        覆盖执行模板中翻译轮次的段落过滤策略（仅对翻译轮次生效）。
        - pending_only: 仅处理 pending 和 rejected 状态的段落
        - skip_approved: 处理除 approved 外的所有状态
        - all: 处理所有状态的段落
        省略时使用执行模板中的配置。
    auto_approve:
      type: boolean
      default: false
      description: 翻译完成后是否自动审批通过所有段落
    execution_config:
      type: object
      additionalProperties: true
  additionalProperties: false

JobProgress:
  type: object
  required: [total_resources, completed_resources, failed_resources, total_segments, completed_segments, skipped_segments]
  properties:
    total_resources:
      type: integer
    completed_resources:
      type: integer
    failed_resources:
      type: integer
    total_segments:
      type: integer
      description: 总段落数（创建时选中的 segment 数）
    completed_segments:
      type: integer
      description: 翻译终态去重段数（仅 ReconcileJob 写入；运行中主进度请用 weighted_*）
    skipped_segments:
      type: integer
      description: 被系统跳过的段落数（已翻译、空文本、纯占位符等）
    weighted_total:
      type: integer
      description: 跨轮工作量总数（各轮 stage_total 累加，实时、单调）；主进度分母。completed_segments 为翻译终态去重值
    weighted_completed:
      type: integer
      description: 跨轮已完成工作量（各轮 stage_completed 累加，实时、单调、≤weighted_total）；主进度分子
    queue_position:
      type: integer
      nullable: true
      description: 在队列中的位置（1-based），null 表示不在队列中
    queue_size:
      type: integer
      nullable: true
      description: 当前队列中的任务总数

JobResource:
  type: object
  required: [id, resource_id, status, segment_count, completed_segments, skipped_segments, created_at, updated_at]
  properties:
    id:
      type: integer
    resource_id:
      type: integer
    status:
      type: string
      enum: [pending, running, completed, failed, cancelled]
    segment_count:
      type: integer
    completed_segments:
      type: integer
    skipped_segments:
      type: integer
      description: 被系统跳过的段落数
    output_path:
      type: string
    error_message:
      type: string
    warning_message:
      type: string
      description: 软警告信息（如 semantic_qa 扫描失败）；资源状态仍为 completed
    resource:
      $ref: './resource.yaml#/Resource'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    current_stage:
      type: string
      description: 当前执行阶段名称
    stage_total:
      type: integer
      description: 当前阶段的总段落数
    stage_completed:
      type: integer
      description: 当前阶段已完成的段落数
    weighted_total:
      type: integer
      description: 跨轮工作量总数（资源级，各轮 stage_total 累加）
    weighted_completed:
      type: integer
      description: 跨轮已完成工作量（资源级，各轮 stage_completed 累加）
    started_at:
      type: string
      format: date-time
      description: 资源开始执行的时间

Job:
  type: object
  required: [id, project_id, execution_plan_id, status, trigger_type, progress, created_at, updated_at]
  properties:
    id:
      type: integer
    project_id:
      type: integer
    created_by:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
    execution_plan_id:
      type: integer
    status:
      type: string
      enum: [pending, running, completed, failed, cancelled]
    trigger_type:
      type: string
      enum: [manual, file_update, glossary_change, web_edit]
    execution_config:
      type: object
      additionalProperties: true
      description: 执行配置快照（已脱敏，不含 API 密钥）
    error_message:
      type: string
    progress:
      $ref: '#/JobProgress'
    job_resources:
      type: array
      items:
        $ref: '#/JobResource'
    started_at:
      type: string
      format: date-time
      description: 任务开始执行的时间
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

JobListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Job'
    next_cursor:
      type: string

Segment:
  type: object
  required: [id, sub_job_id, segment_index, source_text, status, created_at, updated_at]
  properties:
    id:
      type: integer
    sub_job_id:
      type: integer
    segment_index:
      type: integer
    source_text:
      type: string
    target_text:
      type: string
    status:
      type: string
      enum: [pending, translated, edited, approved, rejected]
    review_comment:
      type: string
    reviewed_by:
      $ref: '../../base.yaml#/components/schemas/User'
    quality_issues:
      type: array
      description: QA 检测到的质量问题列表
      items:
        $ref: '#/QualityIssue'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

QualityIssue:
  type: object
  required: [segment_index, severity, code, message, disposition]
  properties:
    segment_index:
      type: integer
    severity:
      type: string
      enum: [warning, error]
    code:
      type: string
      description: 问题代码（untranslated, length_ratio, duplicate, source_residual, punctuation_pairing, punctuation_missing, punctuation_surplus, punctuation_wrap_loss, whitespace_irregular, repeated_space, width_mix, script_mismatch, number_mismatch, url_email_mismatch, subtitle_line_count, forbidden_term, term_inconsistency, leftover_placeholder, xml_tag_mismatch, duplicate_source_divergence, calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register, ruby_restore_incomplete, ruby_tag_loss）
    message:
      type: string
    span:
      $ref: '#/QualityIssueSpan'
      description: 问题在目标/源文本中的跨度；片段级问题可省略
    disposition:
      type: string
      enum: [pending, dismissed]
      description: 裁决状态；pending=未决，dismissed=已判定不是问题
    decided_by:
      type: integer
      nullable: true
      description: 裁决者 user_id；null 表示由 LLM 裁决（adjudicate 轮）
    decided_at:
      type: string
      format: date-time
      nullable: true
      description: 裁决时间
    note:
      type: string
      description: 裁决说明（可选），如"专有名词，有意保留"

QualityIssueSpan:
  type: object
  required: [matched_text]
  properties:
    matched_text:
      type: string
      description: 触发问题的精确文本片段
    target_start:
      type: integer
      description: 目标文本中的起始偏移（按字符/rune）；定位失败时省略
    target_end:
      type: integer
      description: 目标文本中的结束偏移（按字符/rune，半开区间）；定位失败时省略

SegmentEditRequest:
  type: object
  required: [target_text]
  properties:
    target_text:
      type: string
    comment:
      type: string
  additionalProperties: false

SegmentDecisionRequest:
  type: object
  properties:
    comment:
      type: string
  additionalProperties: false

UsageStats:
  type: object
  required: [api_calls, input_tokens, output_tokens, segment_count, usage_records, completed_jobs, failed_jobs]
  properties:
    api_calls:
      type: integer
    input_tokens:
      type: integer
    output_tokens:
      type: integer
    segment_count:
      type: integer
    usage_records:
      type: integer
    completed_jobs:
      type: integer
    failed_jobs:
      type: integer

Activity:
  type: object
  required: [id, action, resource_type, created_at, updated_at]
  properties:
    id:
      type: integer
    action:
      type: string
    resource_type:
      type: string
    resource_id:
      type: integer
    message:
      type: string
    metadata:
      type: object
      additionalProperties: true
    actor:
      $ref: '../../base.yaml#/components/schemas/User'
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ActivityListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Activity'
    next_cursor:
      type: string

JobEvent:
  type: object
  required: [type, job_id, level, message, created_at, seq]
  properties:
    type:
      type: string
    job_id:
      type: integer
    level:
      type: string
    stage:
      type: string
    message:
      type: string
    metadata:
      type: object
      additionalProperties: true
    created_at:
      type: string
      format: date-time
    seq:
      type: integer
      format: int64

JobEventListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/JobEvent'
    next_after_seq:
      type: integer
      format: int64
      description: 正向翻页游标(上一页最后一条事件的 seq);0 表示无更多数据
    next_before_seq:
      type: integer
      format: int64
      description: 反向翻页游标(上一页第一条事件的 seq);0 表示无更多数据
