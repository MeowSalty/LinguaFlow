RetryConfig:
  type: object
  properties:
    max_attempts:
      type: integer
      minimum: 1
      default: 3
      description: |
        池深度 = max_attempts+1（所有 handler 生效）。
        在途重试预算内部封顶 min(max_attempts,3)，不单独暴露。
    backoff_ms:
      type: integer
      minimum: 0
      default: 2000
    jitter:
      type: boolean
      default: true

TranslateSegmentFilterConfig:
  type: object
  description: 翻译轮次段落过滤配置，决定处理哪些翻译状态的段落。
  properties:
    status_filter:
      type: string
      enum: [pending_only, skip_approved, all]
      default: pending_only
      description: |
        - pending_only: 仅处理 pending 和 rejected 状态的段落（默认，等同旧 skip_translated）
        - skip_approved: 处理除 approved 外的所有状态（等同旧 overwrite_unapproved）
        - all: 处理所有状态的段落（等同旧 overwrite_all）

TranslateRoundConfig:
  type: object
  required: [fallback_shrink]
  properties:
    prompt_template_id:
      type: integer
      description: 翻译提示词模板 ID
    batch_size:
      type: integer
      minimum: 0
      description: 待译段落数上限（不计上下文段）；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限（计入上下文段）；0=不限制，与 batch_size 至少填一项。纯行数模式（此项与 context.max_chars 均为 0）下上下文体积不受约束
    fallback_shrink:
      type: number
      minimum: 0
      exclusiveMinimum: true
      maximum: 1
      description: |
        池缩比系数（合法域 (0,1]）：池 N 的批次约束 = floor(orig × shrink^N)。
        1.0 = 不缩（多池同尺寸重切）；(0,1) = 每池缩小。
        0 非法（不缩请用 1.0）；必填，省略/零值会被后端拒绝（不规范化）。
        池数量由 retry.max_attempts+1 决定。
    segment_filter:
      $ref: '#/TranslateSegmentFilterConfig'
      description: 段落过滤配置；省略时默认 pending_only
    retry:
      $ref: '#/RetryConfig'

ExtractRoundConfig:
  type: object
  properties:
    template_id:
      type: integer
      description: 术语抽取提示词模板 ID（BootstrapPromptTemplate）
    batch_size:
      type: integer
      minimum: 0
      default: 20
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项；两者都为 0 时不分批，全部一次发送
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项；两者都为 0 时不分批，全部一次发送
    max_terms_per_1000_chars:
      type: number
      minimum: 0
      default: 25.0
      description: 每 1000 字词的术语抽取上限系数
    min_source_len:
      type: integer
      minimum: 1
      default: 2
      description: 术语源文最短字符数
    # fallback_shrink: 当前仅 translate 轮实现缩批，extract 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

AdjudicateRoundConfig:
  type: object
  description: 质量裁决轮次配置。裁决 system prompt 内置不可见，无 prompt_template_id。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    adjudicate_codes:
      type: array
      items:
        type: string
        enum: [source_residual, length_ratio]
      description: |
        可裁决的质量问题 code 子集。空或不传时默认 ["source_residual"]。
        untranslated 与 duplicate 为硬规则，不可裁决。
    # fallback_shrink: 当前仅 translate 轮实现缩批，adjudicate 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

SemanticQARoundConfig:
  type: object
  description: 语义质检轮次配置。system prompt 内置不可见，无 prompt_template_id；产出 warning 级语义 issue 直接进人审。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    segment_scope:
      type: string
      enum: [all, with_issues, with_issue_codes]
      default: all
      description: |
        段落扫描范围：
        - all（默认）：扫描全部 translated/edited 且译文非空的段，完整语义覆盖。
        - with_issues：仅扫描带任意 issue 的段。
        - with_issue_codes：仅扫描含 issue_codes 声明 code 的段（用于成本敏感的高价值子集，如 ja↔zh 假同源）。
        范围与任务级 segment_ids 取交集。scope≠all 时未扫段保留其原语义 issue。
    issue_codes:
      type: array
      minItems: 1
      items:
        type: string
        enum: [untranslated, length_ratio, duplicate, source_residual, punctuation_pairing, punctuation_missing, punctuation_surplus, punctuation_wrap_loss, whitespace_irregular, repeated_space, width_mix, number_mismatch, url_email_mismatch, subtitle_line_count, forbidden_term, term_inconsistency, leftover_placeholder, xml_tag_mismatch, duplicate_source_divergence, calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register, ruby_restore_incomplete, ruby_tag_loss]
      description: |
        仅 segment_scope=with_issue_codes 时生效，必须列出至少一个要匹配的 issue code。
        允许全部 issue code（规则 + 语义皆可作筛选键）。
    # fallback_shrink: 当前仅 translate 轮实现缩批，semantic_qa 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

ReviseRoundConfig:
  type: object
  description: |
    修订轮次配置。LLM 对已有译文做最小改动定点修订，修复段落上 pending 的语义 issue
    （误译、仿译、漏译等）。system prompt 内置不可见，无 prompt_template_id；
    protect/ruby 及引擎级策略（repair/QA/glossary）经计划级策略引用（profile_id）
    贯穿所有改写型轮次，无需也不依赖计划内 translate 轮的存在。
    写回遵循 correct 轮先例：改写译文与 issues、不改段落状态、CAS 保护。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    segment_scope:
      type: string
      enum: [with_issues, with_issue_codes]
      default: with_issues
      description: |
        段落扫描范围（均要求段落 translated/edited 且译文非空）：
        - with_issues（默认）：修订存在 pending 语义 issue 的段。
        - with_issue_codes：仅修订含 issue_codes 声明 code 的 pending 语义 issue 的段。
        范围与任务级 segment_ids 取交集。
    issue_codes:
      type: array
      minItems: 1
      items:
        type: string
        enum: [calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register]
      description: |
        仅 segment_scope=with_issue_codes 时生效，必须列出至少一个要修复的语义 issue code
        （子集语义白名单，与 semantic_qa 轮的全量 code 筛选键不同）。
    # fallback_shrink: 当前仅 translate 轮实现缩批，revise 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

CorrectRuleConfig:
  type: object
  required: [name]
  properties:
    name:
      type: string
      enum: [punctuation_missing_wrap, punctuation_wrap_loss_wrap, width_mix_normalize]
      description: |
        规则名（白名单）。首发仅 punctuation_missing_wrap：机械修复 punctuation_missing 报出
        的"译文丢失源文引号包裹"的安全子集（单 span、源首尾为配对引号、译文无该引号）。
        另支持 punctuation_wrap_loss_wrap：修复 punctuation_wrap_loss 报出的"译文丢失源文外层引号包裹"（单 span、源首尾配对引号、译文首尾无引号）。
        width_mix_normalize：修复 width_mix 报出的全半角混用——CJK 译文把 9 个零歧义半角标点
        （! ? , ; : ( ) [ ]）转全角（数字双侧的 , : 与数字前缀的 !? run 豁免，保留 1,000/12:30/5! 原样），
        拉丁译文把全角字符（FF01-FF5E，含全角字母数字）转回半角。
    enabled:
      type: boolean
      default: true

CorrectRoundConfig:
  type: object
  description: |
    本地改写轮次配置（纯本地、不调 LLM）。机械修复 QA 报出的高频安全问题子集。
    无 backend_id / batch_size / max_words_per_batch / retry；不分批、无外部 I/O、无重试。
    规则按 rules 顺序执行，首个生效即停（不叠加）。
    是否执行由轮次是否出现在 rounds 数组决定（与其他轮次一致，无 round 级 enabled 开关）。
  required: [rules]
  properties:
    rules:
      type: array
      description: 启用的改写规则，按顺序执行。至少 1 条且 Name 必须在白名单。
      items:
        $ref: '#/CorrectRuleConfig'

ExecutionRoundConfig:
  type: object
  required: [mode, concurrency]
  properties:
    mode:
      type: string
      enum: [translate, extract, adjudicate, semantic_qa, revise, correct]
      description: 轮次模式：translate=翻译，extract=术语抽取，adjudicate=质量裁决，semantic_qa=语义质检，revise=LLM 修订，correct=本地改写
    backend_id:
      type: integer
      description: 后端 ID；correct 轮为纯本地无需后端，可省略（其余 mode 必填且由后端运行时校验为正）
    concurrency:
      type: integer
      minimum: 1
    translate:
      $ref: '#/TranslateRoundConfig'
      description: 翻译模式配置（mode=translate 时必填）
    extract:
      $ref: '#/ExtractRoundConfig'
      description: 术语抽取模式配置（mode=extract 时必填）
    adjudicate:
      $ref: '#/AdjudicateRoundConfig'
      description: 质量裁决模式配置（mode=adjudicate 时必填）
    semantic_qa:
      $ref: '#/SemanticQARoundConfig'
      description: 语义质检模式配置（mode=semantic_qa 时必填）
    revise:
      $ref: '#/ReviseRoundConfig'
      description: 修订模式配置（mode=revise 时必填）
    correct:
      $ref: '#/CorrectRoundConfig'
      description: 本地改写模式配置（mode=correct 时必填且 rules 至少 1 条）

ExecutionPlanTemplateScope:
  type: string
  enum: [user, org, system]

ExecutionPlanRubyRetryConfig:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
      default: false
      description: 是否启用注音对齐重试
    backend_id:
      type: integer
      description: 注音对齐使用的后端 ID；为空或 0 时使用翻译主后端
    max_attempts:
      type: integer
      minimum: 1
      default: 1
      description: 注音对齐重试轮数（仅 enabled=true 时生效）

ExecutionPlanTemplate:
  type: object
  required: [id, name, scope, profile_id, rounds]
  properties:
    id:
      type: integer
    name:
      type: string
    description:
      type: string
    scope:
      $ref: '#/ExecutionPlanTemplateScope'
    owner_user_id:
      type: integer
    owner_org_id:
      type: integer
    profile_id:
      type: integer
      description: |
        策略模板 ID（ExecutionProfile 单表全局唯一；允许内置负 ID，如 -1 内置默认策略）。
        计划级策略引用：为全管道（所有改写型轮次与引擎级行为）供
        protect/ruby/postprocess/repair/glossary/context/qa 七项行为预设，
        任务创建时整体冻结进执行快照。
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ExecutionPlanTemplateListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ExecutionPlanTemplate'

CreateExecutionPlanTemplateRequest:
  type: object
  required: [name, profile_id, rounds]
  properties:
    name:
      type: string
    description:
      type: string
    profile_id:
      type: integer
      description: 策略模板 ID（ExecutionProfile；允许内置负 ID，如 -1 内置默认策略），为全管道供七项行为预设
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
  additionalProperties: false

UpdateExecutionPlanTemplateRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    profile_id:
      type: integer
      description: 策略模板 ID；省略时保留现值（不允许置空——计划必须始终引用一个策略）
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
  additionalProperties: false
