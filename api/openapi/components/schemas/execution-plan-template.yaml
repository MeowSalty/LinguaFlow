RetryConfig:
  type: object
  properties:
    max_attempts:
      type: integer
      minimum: 1
      default: 3
      description: |
        池深度 = max_attempts+1（所有 handler 生效）。
        在途重试预算内部封顶 min(max_attempts,3)，不单独暴露。
    backoff_ms:
      type: integer
      minimum: 0
      default: 2000
    jitter:
      type: boolean
      default: true

TranslateSegmentFilterConfig:
  type: object
  description: 翻译轮次段落过滤配置，决定处理哪些翻译状态的段落。
  properties:
    status_filter:
      type: string
      enum: [pending_only, skip_approved, all]
      default: pending_only
      description: |
        - pending_only: 仅处理 pending 和 rejected 状态的段落（默认，等同旧 skip_translated）
        - skip_approved: 处理除 approved 外的所有状态（等同旧 overwrite_unapproved）
        - all: 处理所有状态的段落（等同旧 overwrite_all）

InlineTermExtractionConfig:
  type: object
  description: |
    翻译轮次的高级选项：在同一次模型请求中返回译文和新术语，供后续批次使用。
    省略或 enabled=false 时不抽取新术语，仍按项目设置使用已有术语表。
    关联项目时，项目 glossary_enabled 为总开关；false 时不应用术语表，也不执行内联提取，轮次配置仍然保存。
    无项目的即时翻译按轮次配置和请求中的术语表决定是否启用术语功能。
  properties:
    enabled:
      type: boolean
      default: false
      description: 是否在本翻译轮次的模型请求中同时抽取新术语；关联项目时还须启用项目术语表总开关
    max_terms_per_1000_words:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
      default: 3
      description: 每 1000 源文字词的术语抽取上限系数；CJK 按字、其他文本按词计数，必须大于 0
    min_source_len:
      type: integer
      minimum: 1
      default: 2
      description: 抽取术语源文的最短字符数（按 rune 计）
    conflict_strategy:
      type: string
      enum: [off, rewrite-local]
      default: rewrite-local
      description: |
        内联提取生效时，新术语与已确认术语冲突的处理方式。
        rewrite-local：按已确认术语改写本批译文；off：仅关闭冲突改写，仍然抽取和合并新术语。
  additionalProperties: false

TranslateRoundConfig:
  type: object
  required: [fallback_shrink, prompt_template_id]
  properties:
    prompt_template_id:
      type: integer
      description: |
        翻译提示词模板 ID。必填：省略或 0 会被后端拒绝（不规范化）。
        允许内置虚拟 ID -1（内置默认翻译提示词模板），其余须为当前作用域可见的模板 ID。
    batch_size:
      type: integer
      minimum: 0
      description: 待译段落数上限（不计上下文段）；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限（计入上下文段）；0=不限制，与 batch_size 至少填一项。纯行数模式（此项与 context.max_chars 均为 0）下上下文体积不受约束
    fallback_shrink:
      type: number
      minimum: 0
      exclusiveMinimum: true
      maximum: 1
      description: |
        池缩比系数（合法域 (0,1]）：池 N 的批次约束 = floor(orig × shrink^N)。
        1.0 = 不缩（多池同尺寸重切）；(0,1) = 每池缩小。
        0 非法（不缩请用 1.0）；必填，省略/零值会被后端拒绝（不规范化）。
        池数量由 retry.max_attempts+1 决定。
    segment_filter:
      $ref: '#/TranslateSegmentFilterConfig'
      description: 段落过滤配置；省略时默认 pending_only
    inline_term_extraction:
      $ref: '#/InlineTermExtractionConfig'
    retry:
      $ref: '#/RetryConfig'

ExtractRoundConfig:
  type: object
  description: |
    独立术语抽取轮次配置。关联项目 glossary_enabled=false 时跳过本轮，轮次配置仍然保存。
    无项目的即时翻译按轮次配置执行。
  required: [template_id]
  properties:
    template_id:
      type: integer
      description: |
        术语抽取提示词模板 ID（BootstrapPromptTemplate）。必填：省略或 0 会被后端拒绝（不规范化）。
        允许内置虚拟 ID -1（内置默认引导提示词模板），其余须为当前作用域可见的模板 ID。
    batch_size:
      type: integer
      minimum: 0
      default: 20
      description: 段落数上限；0=不限制；与 max_words_per_batch 都为 0 时不分批，全部一次发送
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制；与 batch_size 都为 0 时不分批，全部一次发送
    max_terms_per_1000_chars:
      type: number
      minimum: 0
      default: 25.0
      description: 每 1000 字词的术语抽取上限系数
    min_source_len:
      type: integer
      minimum: 1
      default: 2
      description: 术语源文最短字符数
    # fallback_shrink: 当前仅 translate 轮实现缩批，extract 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

AdjudicateRoundConfig:
  type: object
  description: 质量裁决轮次配置。裁决 system prompt 内置不可见，无 prompt_template_id。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    adjudicate_codes:
      type: array
      items:
        type: string
        enum: [source_residual, length_ratio, punctuation_surplus, untranslated]
      description: |
        可裁决的质量问题 code 子集。不传时默认 ["source_residual", "punctuation_surplus"]；显式空数组表示不处理任何问题。
        duplicate 为硬规则，不可裁决（需同批多段输入，无单段裁决语义）。
        untranslated 可裁决：源语与目标语共用文字系统时，同形译文（专有名词、纯汉字标题、原样保留的英文片段）在确定性层面与真正的原文回传不可区分，需 LLM 判断是否为有意保留。
    # fallback_shrink: 当前仅 translate 轮实现缩批，adjudicate 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

SemanticQARoundConfig:
  type: object
  description: 语义质检轮次配置。system prompt 内置不可见，无 prompt_template_id；产出 warning 级语义 issue 直接进人审。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    segment_scope:
      type: string
      enum: [all, with_issues, with_issue_codes]
      default: all
      description: |
        段落扫描范围：
        - all（默认）：扫描全部 translated/edited 且译文非空的段，完整语义覆盖。
        - with_issues：仅扫描带任意 issue 的段。
        - with_issue_codes：仅扫描含 issue_codes 声明 code 的段（用于成本敏感的高价值子集，如 ja↔zh 假同源）。
        范围与任务级 segment_ids 取交集。scope≠all 时未扫段保留其原语义 issue。
    issue_codes:
      type: array
      items:
        type: string
        enum: [untranslated, length_ratio, duplicate, source_residual, punctuation_pairing, punctuation_missing, punctuation_surplus, punctuation_wrap_loss, whitespace_irregular, repeated_space, width_mix, script_mismatch, number_mismatch, url_email_mismatch, subtitle_line_count, forbidden_term, term_inconsistency, leftover_placeholder, xml_tag_mismatch, duplicate_source_divergence, calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register, ruby_restore_incomplete, ruby_tag_loss]
      description: |
        仅 segment_scope=with_issue_codes 时生效，必须列出至少一个要匹配的 issue code。
        允许全部 issue code（规则 + 语义皆可作筛选键）。
    # fallback_shrink: 当前仅 translate 轮实现缩批，semantic_qa 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

ReviseRoundConfig:
  type: object
  description: |
    修订轮次配置。LLM 对已有译文做最小改动定点修订，修复段落上 pending 的语义 issue
    （误译、仿译、漏译等）。system prompt 内置不可见，无 prompt_template_id；
    protect/ruby 及引擎级策略（repair/QA）经计划级策略引用（profile_id）
    贯穿所有改写型轮次，无需也不依赖计划内 translate 轮的存在。
    写回遵循 correct 轮先例：改写译文与 issues、不改段落状态、CAS 保护。
  properties:
    batch_size:
      type: integer
      minimum: 0
      description: 段落数上限；0=不限制，与 max_words_per_batch 至少填一项
    max_words_per_batch:
      type: integer
      minimum: 0
      description: 字词数上限；0=不限制，与 batch_size 至少填一项
    segment_scope:
      type: string
      enum: [with_issues, with_issue_codes]
      default: with_issues
      description: |
        段落扫描范围（均要求段落 translated/edited 且译文非空）：
        - with_issues（默认）：修订存在 pending 语义 issue 的段。
        - with_issue_codes：仅修订含 issue_codes 声明 code 的 pending 语义 issue 的段。
        范围与任务级 segment_ids 取交集。
    issue_codes:
      type: array
      items:
        type: string
        enum: [calque, term_fidelity, naturalness, mistranslation, omission, addition, grammar, register]
      description: |
        segment_scope=with_issue_codes 时必须列出至少一个要修复的语义 issue code
        （子集语义白名单，与 semantic_qa 轮的全量 code 筛选键不同）。
        with_issues 下省略此字段表示全部语义问题，显式空数组表示不修订任何问题。
    # fallback_shrink: 当前仅 translate 轮实现缩批，revise 失败模式与批次大小无关，
    # 不需要缩批，故暂不暴露。若未来需要，在此加 type:number / minimum:0 / maximum:1。
    retry:
      $ref: '#/RetryConfig'

CorrectRuleConfig:
  type: object
  required: [name]
  properties:
    name:
      type: string
      enum: [punctuation_missing_wrap, punctuation_wrap_loss_wrap, width_mix_normalize]
      description: |
        规则名（白名单）。首发仅 punctuation_missing_wrap：机械修复 punctuation_missing 报出
        的"译文丢失源文引号包裹"的安全子集（单 span、源首尾为配对引号、译文无该引号）。
        另支持 punctuation_wrap_loss_wrap：修复 punctuation_wrap_loss 报出的"译文丢失源文外层引号包裹"（单 span、源首尾配对引号、译文首尾无引号）。
        width_mix_normalize：修复 width_mix 报出的全半角混用——CJK 译文把 9 个零歧义半角标点
        （! ? , ; : ( ) [ ]）转全角（数字双侧的 , : 与数字前缀的 !? run 豁免，保留 1,000/12:30/5! 原样），
        拉丁译文把全角字符（FF01-FF5E，含全角字母数字）转回半角。
    enabled:
      type: boolean
      default: true

CorrectRoundConfig:
  type: object
  description: |
    本地改写轮次配置（纯本地、不调 LLM）。机械修复 QA 报出的高频安全问题子集。
    无 backend_id / batch_size / max_words_per_batch / retry；不分批、无外部 I/O、无重试。
    规则按 rules 顺序执行，首个生效即停（不叠加）。
    是否执行由轮次是否出现在 rounds 数组决定（与其他轮次一致，无 round 级 enabled 开关）。
  required: [rules]
  properties:
    rules:
      type: array
      description: 启用的改写规则，按顺序执行。至少 1 条且 Name 必须在白名单。
      items:
        $ref: '#/CorrectRuleConfig'

ExecutionRoundConfig:
  type: object
  required: [mode, concurrency]
  properties:
    mode:
      type: string
      enum: [translate, extract, adjudicate, semantic_qa, revise, correct]
      description: 轮次模式：translate=翻译，extract=术语抽取，adjudicate=质量裁决，semantic_qa=语义质检，revise=LLM 修订，correct=本地改写
    backend_id:
      type: integer
      description: 后端 ID；correct 轮为纯本地无需后端，可省略（其余 mode 必填且由后端运行时校验为正）
    concurrency:
      type: integer
      minimum: 1
    translate:
      $ref: '#/TranslateRoundConfig'
      description: 翻译模式配置（mode=translate 时必填）
    extract:
      $ref: '#/ExtractRoundConfig'
      description: 术语抽取模式配置（mode=extract 时必填）
    adjudicate:
      $ref: '#/AdjudicateRoundConfig'
      description: 质量裁决模式配置（mode=adjudicate 时必填）
    semantic_qa:
      $ref: '#/SemanticQARoundConfig'
      description: 语义质检模式配置（mode=semantic_qa 时必填）
    revise:
      $ref: '#/ReviseRoundConfig'
      description: 修订模式配置（mode=revise 时必填）
    correct:
      $ref: '#/CorrectRoundConfig'
      description: 本地改写模式配置（mode=correct 时必填且 rules 至少 1 条）

ExecutionPlanTemplateScope:
  type: string
  enum: [user, org, system]

ExecutionPlanRubyRetryConfig:
  type: object
  required: [enabled]
  properties:
    enabled:
      type: boolean
      default: false
      description: 是否启用注音对齐重试
    backend_id:
      type: integer
      description: 注音对齐使用的后端 ID；为空或 0 时使用翻译主后端
    max_attempts:
      type: integer
      minimum: 1
      default: 1
      description: 注音对齐重试轮数（仅 enabled=true 时生效）
    concurrency:
      type: integer
      minimum: 1
      description: 单个任务全部资源与轮次共享的注音请求并发上限；省略时创建任务按版本化默认值 1 物化，与主轮 concurrency 独立。显式 0 或负数无效。
    batch_size:
      type: integer
      minimum: 0
      default: 1
      description: 每次注音请求的段数上限；0 表示不限段数。与 max_words_per_batch 不可同时为 0。尾批不足上限时直接发送，正常重试保持上限；仅批级协议异常触发单段兜底。
    max_words_per_batch:
      type: integer
      minimum: 0
      default: 0
      description: 注音合批的内容字词数上限；0 表示不限字词数。计入实际发送的原文、候选译文、正文区域及 missing 文本，固定模板/schema 不计入。单段超限时独占请求。
    batch_wait_ms:
      type: integer
      minimum: 0
      maximum: 9223372036854
      default: 25
      description: 最大凑批等待毫秒数；0 表示立即派发。等待不预扣尝试次数，也不占注音并发或 RPM 配额。

ExecutionPlanTemplate:
  type: object
  required: [id, name, scope, profile_id, rounds]
  properties:
    id:
      type: integer
    name:
      type: string
    description:
      type: string
    scope:
      $ref: '#/ExecutionPlanTemplateScope'
    owner_user_id:
      type: integer
    owner_org_id:
      type: integer
    profile_id:
      type: integer
      description: |
        策略模板 ID（ExecutionProfile 单表全局唯一；允许内置负 ID，如 -1 内置默认策略）。
        计划级策略引用：为全管道（所有改写型轮次与引擎级行为）提供策略预设，
        任务创建时整体冻结进执行快照。
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time

ExecutionPlanTemplateListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/ExecutionPlanTemplate'

CreateExecutionPlanTemplateRequest:
  type: object
  description: 省略 org_id 创建个人对象；指定组织时必须为 admin/owner。归属不可更新，组织共享依赖只允许同组织或系统对象。
  required: [name, profile_id, rounds]
  properties:
    org_id:
      type: integer
      minimum: 1
    name:
      type: string
    description:
      type: string
    profile_id:
      type: integer
      description: 策略模板 ID（ExecutionProfile；允许内置负 ID，如 -1 内置默认策略），为全管道提供策略预设
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
  additionalProperties: false

UpdateExecutionPlanTemplateRequest:
  type: object
  properties:
    name:
      type: string
    description:
      type: string
    profile_id:
      type: integer
      description: 策略模板 ID；省略时保留现值（不允许置空——计划必须始终引用一个策略）
    ruby_retry:
      $ref: '#/ExecutionPlanRubyRetryConfig'
    rounds:
      type: array
      items:
        $ref: '#/ExecutionRoundConfig'
      minItems: 1
  additionalProperties: false
