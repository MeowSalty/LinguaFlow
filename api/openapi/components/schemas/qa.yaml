QaRecheckRequest:
  type: object
  required: [profile_id]
  properties:
    profile_id:
      type: integer
      minimum: 1
      description: |
        执行策略（profile）ID。QA 检查配置（开关/checks/阈值）与
        保护规则均取自该策略的当前状态；策略未启用 QA 时返回 400。
    resource_ids:
      type: array
      items:
        type: integer
        minimum: 1
    segment_ids:
      type: array
      items:
        type: integer
        minimum: 1
    segment_group_keys:
      type: array
      items:
        type: string
      description: |
        按章节分组键选择 segments（仅适用于 EPUB 等多章节资源）。
        传入 meta.epub_file 值（如 ["OEBPS/chapter1.xhtml"]），后端自动解析为对应的 segment_ids。
        与 segment_ids 互斥，优先级：segment_group_keys > segment_ids > resource_ids。
        三者皆空时选择项目内全部资源。
  additionalProperties: false

QaRecheckResult:
  type: object
  required:
    - profile_id
    - profile_name
    - resources_checked
    - segments_checked
    - segments_skipped_no_target
    - segments_skipped_concurrent
    - issues_new
    - issues_cleared
    - dispositions_inherited
    - resources
    - resources_skipped_busy
  properties:
    profile_id:
      type: integer
      description: 本次重检使用的执行策略 ID
    profile_name:
      type: string
      description: 本次重检使用的执行策略名称
    resources_checked:
      type: integer
      description: 实际执行重检的资源数（不含跳过的忙碌资源）
    segments_checked:
      type: integer
      description: 实际重检的段落总数（有译文且未被并发跳过）
    segments_skipped_no_target:
      type: integer
      description: 无译文被跳过的段落总数
    segments_skipped_concurrent:
      type: integer
      description: 重检期间译文被并发修改而跳过写回的段落总数
    issues_new:
      type: integer
      description: 新增问题数（新指纹）
    issues_cleared:
      type: integer
      description: 被清除的旧确定性问题数（指纹消失；语义/守恒类保留不计入）
    dispositions_inherited:
      type: integer
      description: 继承到既有裁决（含 dismissed）的问题数
    resources:
      type: array
      items:
        $ref: '#/QaRecheckResourceResult'
    resources_skipped_busy:
      type: array
      items:
        $ref: '#/QaRecheckBusyResource'
  additionalProperties: false

QaRecheckResourceResult:
  type: object
  required:
    - resource_id
    - resource_name
    - segments_checked
    - segments_skipped_no_target
    - segments_skipped_concurrent
    - issues_new
    - issues_cleared
    - dispositions_inherited
  properties:
    resource_id:
      type: integer
    resource_name:
      type: string
    segments_checked:
      type: integer
    segments_skipped_no_target:
      type: integer
    segments_skipped_concurrent:
      type: integer
    issues_new:
      type: integer
    issues_cleared:
      type: integer
    dispositions_inherited:
      type: integer
  additionalProperties: false

QaRecheckBusyResource:
  type: object
  required: [resource_id, active_job_id]
  properties:
    resource_id:
      type: integer
    active_job_id:
      type: integer
      description: 占用该资源的未完成任务 ID
  additionalProperties: false
