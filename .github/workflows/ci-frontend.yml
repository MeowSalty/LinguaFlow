name: 前端 CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, frontend]
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查与格式化
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 运行 lint
        run: task frontend:lint

  type-check:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 运行类型检查
        run: task frontend:type-check

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 运行单元测试
        run: task frontend:test

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 构建前端
        run: task frontend:build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/


  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 运行漏洞扫描
        run: pnpm audit --audit-level=high
        working-directory: frontend
