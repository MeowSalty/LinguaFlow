name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'Taskfile.yml'
      - 'backend/Taskfile.yml'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/internal/api/openapi*.go'
      - 'backend/internal/ent/**'
      - 'backend/internal/tools/ent-generate/**'
      - 'frontend/Taskfile.yml'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/api/types.d.ts'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [main, frontend, backend]
    paths:
      - 'api/**'
      - 'Taskfile.yml'
      - 'backend/Taskfile.yml'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/internal/api/openapi*.go'
      - 'backend/internal/ent/**'
      - 'backend/internal/tools/ent-generate/**'
      - 'frontend/Taskfile.yml'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - 'frontend/src/api/types.d.ts'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: OpenAPI 规范验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 验证 OpenAPI 规范
        run: task openapi:lint

      - name: 安装前端依赖
        run: task frontend:install -- --frozen-lockfile

      - name: 安装 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 校验 OpenAPI bundle 一致性
        if: github.event_name != 'pull_request' || github.head_ref != 'frontend'
        run: task openapi:check:api

      - name: 校验后端生成物一致性
        if: github.event_name != 'pull_request' || github.head_ref != 'frontend'
        run: task openapi:check:backend

      - name: 校验前端生成物一致性
        if: github.head_ref == 'frontend'
        run: task openapi:check:frontend

      - name: 检查 ent 生成文件一致性
        if: github.event_name != 'pull_request' || github.head_ref != 'frontend'
        run: task backend:ent:check
