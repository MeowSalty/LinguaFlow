name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [main, frontend, backend]
    paths:
      - 'api/**'
      - '.github/workflows/ci-api.yml'

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: OpenAPI 规范验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        if: github.ref_name != 'backend'
        uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 合并 OpenAPI 规范
        run: pnpm --package=@redocly/cli dlx redocly bundle api/openapi/base.yaml -o api/openapi/openapi-3.0.yaml

      - name: 验证 OpenAPI 规范
        run: pnpm --package=@redocly/cli dlx redocly lint api/openapi/openapi-3.0.yaml

      - name: 安装前端依赖
        if: github.ref_name != 'backend'
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: 验证 TypeScript 类型生成
        if: github.ref_name != 'backend'
        run: pnpm exec openapi-typescript ../api/openapi/openapi-3.0.yaml -o src/api/types.d.ts
        working-directory: frontend

      - name: 安装 Go
        if: github.ref_name != 'frontend'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: 验证后端 OpenAPI 代码生成
        if: github.ref_name != 'frontend'
        run: go generate ./internal/api
        working-directory: backend
