name: 后端 CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-backend.yml'
      - '!backend/**/*.md'
      - '!api/**/*.md'
  pull_request:
    branches: [main, backend]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-backend.yml'
      - '!backend/**/*.md'
      - '!api/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查与格式化
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 从 go.mod 读取 Go 系列
        id: go-version
        shell: bash
        run: awk '$1 == "go" { sub(/\r$/, "", $2); n = split($2, v, "."); if (n < 2 || v[1] !~ /^[0-9]+$/ || v[2] !~ /^[0-9]+$/) exit 1; print "series=" v[1] "." v[2]; found = 1; exit } END { if (!found) exit 1 }' backend/go.mod >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.series }}
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: 检查 Go 代码格式
        run: task backend:format:check

      - name: 运行 go vet 静态检查
        run: task backend:lint

  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_MODE: ${{ github.event_name == 'pull_request' && 'plain' || 'race-atomic' }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linguaflow
          POSTGRES_PASSWORD: linguaflow-test
          POSTGRES_DB: linguaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linguaflow -d linguaflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 从 go.mod 读取 Go 系列
        id: go-version
        shell: bash
        run: awk '$1 == "go" { sub(/\r$/, "", $2); n = split($2, v, "."); if (n < 2 || v[1] !~ /^[0-9]+$/ || v[2] !~ /^[0-9]+$/) exit 1; print "series=" v[1] "." v[2]; found = 1; exit } END { if (!found) exit 1 }' backend/go.mod >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.series }}
          check-latest: true
          cache: false

      - name: 获取测试缓存路径与工具链
        id: go-test-cache
        working-directory: backend
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"

      - name: 恢复并保存 Go 测试模块缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-test-cache.outputs.modules }}
          key: go-test-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-test-cache.outputs.image }}-${{ steps.go-test-cache.outputs.version }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}

      # 新源码快照保存新增编译产物，不与 lint/build 共用固定快照。
      # count=1 强制实跑全部测试；移除它前须重新核验 API、数据库和外部工具输入。
      - name: 恢复并保存 Go 测试编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-test-cache.outputs.build }}
          key: go-test-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-test-cache.outputs.image }}-${{ steps.go-test-cache.outputs.version }}-${{ env.TEST_MODE }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ hashFiles('backend/**', 'api/**', 'Taskfile.yml', '.github/workflows/ci-backend.yml') }}
          restore-keys: |
            go-test-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-test-cache.outputs.image }}-${{ steps.go-test-cache.outputs.version }}-${{ env.TEST_MODE }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-

      - name: 运行测试（PR 普通测试，main 竞态与覆盖率）
        # PF-04 修后同 runner 的最差串行墙钟 / 0.75 决定预算；不以延时替代性能修复。
        timeout-minutes: 90
        shell: bash
        env:
          LINGUAFLOW_TEST_POSTGRES_DSN: postgres://linguaflow:linguaflow-test@localhost:5432/linguaflow_test?sslmode=disable
        run: |
          task backend:test:ci MODE="$TEST_MODE" OUTPUT_DIR=".ci-test/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: 上传完整测试证据（失败也保留分片原始数据）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/.ci-test/${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: 上传覆盖率报告
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/.ci-test/${{ github.run_id }}-${{ github.run_attempt }}/coverage.out
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 从 go.mod 读取 Go 系列
        id: go-version
        shell: bash
        run: awk '$1 == "go" { sub(/\r$/, "", $2); n = split($2, v, "."); if (n < 2 || v[1] !~ /^[0-9]+$/ || v[2] !~ /^[0-9]+$/) exit 1; print "series=" v[1] "." v[2]; found = 1; exit } END { if (!found) exit 1 }' backend/go.mod >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.series }}
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: 构建二进制文件
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: task backend:build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: linguaflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/bin/

  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - name: 从 go.mod 读取 Go 系列
        id: go-version
        shell: bash
        run: awk '$1 == "go" { sub(/\r$/, "", $2); n = split($2, v, "."); if (n < 2 || v[1] !~ /^[0-9]+$/ || v[2] !~ /^[0-9]+$/) exit 1; print "series=" v[1] "." v[2]; found = 1; exit } END { if (!found) exit 1 }' backend/go.mod >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-version.outputs.series }}
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: 运行漏洞扫描
        run: task backend:security
