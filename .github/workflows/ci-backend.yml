name: 后端 CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, backend]
    paths:
      - 'backend/**'
      - 'api/**'
      - 'Taskfile.yml'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 代码检查与格式化
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 检查 Go 代码格式
        run: task backend:format:check

      - name: 运行 go vet 静态检查
        run: task backend:lint

  test:
    name: 自动化测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: linguaflow
          POSTGRES_PASSWORD: linguaflow-test
          POSTGRES_DB: linguaflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linguaflow -d linguaflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 运行测试（含竞态检测）
        env:
          LINGUAFLOW_TEST_POSTGRES_DSN: postgres://linguaflow:linguaflow-test@localhost:5432/linguaflow_test?sslmode=disable
        run: task backend:test:race -- -coverprofile=coverage.out -covermode=atomic ./...

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/coverage.out

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 构建二进制文件
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: task backend:build

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: linguaflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/bin/

  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: go-task/setup-task@v2
        with:
          version: '3.51.1'

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: 运行漏洞扫描
        run: task backend:security
