version: '3'

includes:
  frontend:
    taskfile: ./frontend/Taskfile.yml
    dir: ./frontend
  backend:
    taskfile: ./backend/Taskfile.yml
    dir: ./backend

vars:
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  DOCS_DIR: docs
  OPENAPI_ENTRY: api/openapi/base.yaml
  OPENAPI_SCHEMA: api/openapi/openapi-3.0.yaml

tasks:
  default:
    desc: 查看可用任务列表
    cmds:
      - task --list

  ci:lint:
    desc: 检查 GitHub Actions 工作流语法和表达式
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 {{.CLI_ARGS}}

  openapi:bundle:
    desc: 合并多文件 OpenAPI 规范为单文件
    sources:
      - '{{.OPENAPI_ENTRY}}'
      - 'api/openapi/**/*.yaml'
    generates:
      - '{{.OPENAPI_SCHEMA}}'
    cmds:
      - pnpm --package=@redocly/cli dlx redocly bundle {{.OPENAPI_ENTRY}} -o {{.OPENAPI_SCHEMA}}

  openapi:generate:
    desc: 生成前端和后端 OpenAPI 代码
    deps:
      - openapi:bundle
    cmds:
      - task: frontend:openapi:generate
      - task: backend:openapi:generate

  openapi:lint:
    desc: 验证 OpenAPI 规范
    deps: [openapi:bundle]
    cmds:
      - pnpm --package=@redocly/cli dlx redocly lint {{.OPENAPI_SCHEMA}}

  openapi:check:api:
    desc: 校验 OpenAPI 源规范与已同步 bundle 一致(api 所有权)
    cmds:
      - task --force openapi:bundle
      - git diff --exit-code -- {{.OPENAPI_SCHEMA}}

  openapi:check:backend:
    desc: 校验后端 OpenAPI 生成代码已同步(backend 所有权)
    cmds:
      - task --force openapi:bundle
      - task: backend:openapi:generate
      - git diff --exit-code -- backend/internal/api/openapi.gen.go backend/go.mod backend/go.sum

  openapi:check:frontend:
    desc: 校验前端 OpenAPI 类型已同步(frontend 所有权)
    cmds:
      - task --force openapi:bundle
      - task: frontend:openapi:generate
      - git diff --exit-code -- frontend/src/api/types.d.ts

  openapi:check:
    desc: 重新生成并检查全部 OpenAPI 产物是否已同步(本地全量校验;CI 按所有权分别调用 openapi:check:*)
    cmds:
      - task: openapi:check:api
      - task: openapi:check:backend
      - task: openapi:check:frontend

  backend:local:build:
    desc: 构建含嵌入前端的本地模式二进制
    deps:
      - backend:web:embed
    cmds:
      - task: backend:build

  backend:web:embed:
    desc: 将前端构建产物嵌入后端
    deps:
      - frontend:build
    cmds:
      - cmd: rm -rf {{.BACKEND_DIR}}/internal/web/dist && cp -r {{.FRONTEND_DIR}}/dist {{.BACKEND_DIR}}/internal/web/dist
        platforms: [linux, darwin]
      - cmd: powershell -Command "if (Test-Path '{{.BACKEND_DIR}}/internal/web/dist') { Remove-Item -Recurse -Force '{{.BACKEND_DIR}}/internal/web/dist' }; Copy-Item -Recurse '{{.FRONTEND_DIR}}/dist' '{{.BACKEND_DIR}}/internal/web/dist'"
        platforms: [windows]

  docs:install:
    desc: 安装文档依赖
    dir: '{{.DOCS_DIR}}'
    cmds:
      - pnpm install

  docs:dev:
    desc: 启动文档开发服务器
    deps:
      - docs:install
    dir: '{{.DOCS_DIR}}'
    cmds:
      - pnpm dev

  docs:build:
    desc: 构建文档
    deps:
      - docs:install
    dir: '{{.DOCS_DIR}}'
    cmds:
      - pnpm build

  docs:preview:
    desc: 预览构建后的文档
    deps:
      - docs:build
    dir: '{{.DOCS_DIR}}'
    cmds:
      - pnpm preview

  sync:check:
    desc: 检查当前分支与远端的分叉（落后 origin/main 与 origin/<当前分支>，只读）
    cmds:
      - git fetch origin --quiet
      - |
        cur=$(git rev-parse --abbrev-ref HEAD)
        bm=$(git rev-list --count HEAD..origin/main 2>/dev/null || echo 0)
        bc=$(git rev-list --count HEAD..origin/$cur 2>/dev/null || echo 0)
        echo "当前分支: $cur"
        if [ "$bc" -gt 0 ]; then
          echo "WARNING: 本地落后 origin/$cur $bc 个提交，建议 git pull --ff-only origin $cur"
        else
          echo "OK: 与 origin/$cur 同步"
        fi
        if [ "$bm" -gt 0 ]; then
          echo "WARNING: 落后 origin/main $bm 个提交，建议 task sync:main"
        else
          echo "OK: 与 origin/main 同步"
        fi

  sync:main:
    desc: 将 origin/main 合并进当前分支（全树模型，无需清理）
    cmds:
      - git fetch origin
      - git merge origin/main --no-edit

  sync:pull:
    desc: 拉取当前分支的远端更新（fast-forward，远端有新提交时用）
    cmds:
      - |
        cur=$(git rev-parse --abbrev-ref HEAD)
        git pull --ff-only origin "$cur"
