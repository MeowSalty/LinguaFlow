# Same defaults as execution.DefaultProfile; explicit false/0/[] are preserved.
schema_version: 1
protect:
  enabled: true
  rules: [code, link, placeholder, xml]
ruby:
  enabled: true
  preserve_kinds: [creative]
postprocess:
  enabled: true
  trim_spaces: true
repair:
  enabled: true
  json_structural: true
  schema_aliases: true
  placeholder_normalize: true
  prompt_upgrade: true
glossary:
  bootstrap:
    enabled: false
    max_terms_per_1000_chars: 3.0
    min_source_len: 2
    inline_conflict_strategy: rewrite-local
context:
  enabled: true
  before: 1
  after: 1
  max_chars: 0
qa:
  enabled: false
