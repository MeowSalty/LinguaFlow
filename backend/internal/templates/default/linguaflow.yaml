# Independent translation document. Deployment uses kind: server instead.
# Only documented translation flags override this file; no automatic .env loading.
kind: translation
version: 2
source_lang: auto
target_lang: zh
backends:
  openai-default:
    type: openai
    enabled: true
    rate_limit_per_minute: 0
    # Secret is registered only in this process and never copied into the spec.
    secret: ${OPENAI_API_KEY}
    options:
      base_url: https://api.openai.com/v1
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 0
      timeout: 60s
      response_format: json_schema
translation_prompt_templates:
  通用提示词:
    file: prompts/default_translation.tmpl
bootstrap_prompt_templates:
  通用术语抽取:
    file: prompts/default_bootstrap.tmpl
translation_profiles:
  通用策略:
    file: profiles/default.yaml
execution:
  profile: 通用策略
  rounds:
    - mode: translate
      backend: openai-default
      translate:
        prompt: 通用提示词
        batch_size: 1
        max_words_per_batch: 0
        concurrency: 4
        fallback_shrink: 0.5
        # Extract new terms alongside this round's translation; glossary.enabled must also be true.
        inline_term_extraction:
          enabled: false
          max_terms_per_1000_words: 3
          min_source_len: 2
          conflict_strategy: rewrite-local
        retry:
          max_attempts: 3
          backoff_ms: 2000
          jitter: true
glossary:
  enabled: false
  path: ./glossary.csv
  save: true
# Translation memory, QA, plugins and output policy settings are unsupported.
# Use --output for the destination; non-default unsupported settings are errors.
log:
  level: info
  format: text
