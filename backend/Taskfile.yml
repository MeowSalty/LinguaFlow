version: '3'

# 保留依赖本地迁移源码、Compose 示例的辅助命令；CI 检出不需要此文件。
includes:
  local:
    taskfile: ./Taskfile.local.yml
    optional: true
    flatten: true

vars:
  BACKEND_BINARY: '{{default "bin/linguaflow" .BACKEND_BINARY}}'
  TARGET_GOOS: '{{default OS .GOOS}}'
  BACKEND_EXE_EXT: '{{if eq .TARGET_GOOS "windows"}}.exe{{end}}'
  BACKEND_LDFLAGS_EXTRA: '{{default "" .BACKEND_LDFLAGS_EXTRA}}'
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  VERSION: '{{default .GIT_VERSION .VERSION}}'
  COMMIT: '{{default .GIT_COMMIT .COMMIT}}'
  BACKEND_LDFLAGS: '{{default (printf "%s -X github.com/MeowSalty/LinguaFlow/backend/internal/version.Version=%s -X github.com/MeowSalty/LinguaFlow/backend/internal/version.Commit=%s" .BACKEND_LDFLAGS_EXTRA .VERSION .COMMIT) .BACKEND_LDFLAGS}}'

tasks:
  test:auth:deployment:
    desc: 隔离 PostgreSQL、Keycloak 26.8.0、通用 OAuth 及同源/跨域 A/B1/B2/B3 认证验收
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/deployment.mjs --postgres

  test:auth:browser:
    desc: 真实 Keycloak、受控通用 OAuth 与双部署浏览器认证验收
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/deployment.mjs

  test:auth:browser:syntax:
    desc: 检查后端独立认证浏览器验收脚本语法
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node --check ./internal/authacceptance/deployment.mjs
      - node --check ./internal/authacceptance/runtime.mjs
      - node --check ./internal/authacceptance/oauth2.mjs
      - node --check ./internal/authacceptance/github.mjs
      - node --check ./internal/authacceptance/postgres-b3.mjs
      - node --check ./internal/authacceptance/postgres-b4.mjs
      - node --check ./internal/authacceptance/postgres-b5.mjs

  test:auth:b5:
    desc: B5 本地政策、注册要求、派生规则及部署恢复验收
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -count=1 ./internal/accountidentity ./internal/authrules
      - go test -count=1 ./internal/service ./internal/api ./internal/cli -run 'AuthenticationB5|AuthenticationRecovery'

  test:auth:postgres:b5:
    desc: B5 隔离 PostgreSQL 配置、注册、账号维护和部署恢复竞态验收（未配置不计通过）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/postgres-b5.mjs

  test:auth:postgres:b4:
    desc: 独立隔离 PostgreSQL B4 认证契约与竞态验收（等待整个 Go 测试完成再清理实例）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/postgres-b4.mjs

  test:auth:postgres:b3:
    desc: 独立隔离 PostgreSQL B3 认证竞态验收（等待整个测试完成再清理实例）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/postgres-b3.mjs
      - node --check ./internal/authacceptance/postgres-b4.mjs

  test:auth:github:
    desc: 显式真实 GitHub OAuth 交互验收（需专用 OAuth App 与人工浏览器授权；未运行不得记为通过）
    dir: '{{.TASKFILE_DIR}}'
    dotenv: ['{{.TASKFILE_DIR}}/internal/authacceptance/.env']
    interactive: true
    cmds:
      - node ./internal/authacceptance/github.mjs

  auth:prepare:
    desc: 下载并校验隔离认证验收所需的 Keycloak 26.8.0
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - node ./internal/authacceptance/prepare.mjs

  auth:browser:install:
    desc: 安装后端独立浏览器验收依赖与 Chromium（不改前端）
    dir: '{{.TASKFILE_DIR}}/internal/authacceptance'
    cmds:
      - pnpm install --ignore-workspace --registry=https://registry.npmjs.org
      - pnpm exec playwright install chromium

  test:auth:
    desc: 认证合同、状态机及网络边界定向测试
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -count=1 ./internal/authrules ./internal/authoidc ./internal/authoauth2 ./internal/config ./internal/service ./internal/api ./internal/database -run 'Auth|OIDC|OAuth|Generic|External|Login|Register|Registration|Reauthentication|Refresh|Password|Session|Connection'

  test:auth:postgres:
    desc: 真实 PostgreSQL 认证竞态验收（缺少 DSN 直接失败）
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: test -n "$LINGUAFLOW_TEST_POSTGRES_DSN"
        msg: PostgreSQL 未验收，必须提供隔离实例 LINGUAFLOW_TEST_POSTGRES_DSN
    cmds:
      - go test -race -count=1 ./internal/service ./internal/database -run 'Auth|OAuth|Generic|External|Login|Register|Registration|Reauthentication|Refresh|Password|Session|Connection'

  deps:tidy:
    desc: 整理后端 Go 模块依赖
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go mod tidy

  migrate:list:
    desc: 展示统一离线路线、支持矩阵与历史归档指引（不读取数据库和秘密）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate list {{.CLI_ARGS}}

  migrate:inspect:
    desc: 仅解析数据库连接输入并只读探测源格式
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate inspect {{.CLI_ARGS}}

  migrate:plan:
    desc: 冻结 v0.15 源指纹、账号映射、原地或独立目标策略及工具 build
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate upgrade plan {{.CLI_ARGS}}

  migrate:rehearse:
    desc: 在隔离目标实际转换并保留验证报告（需 --offline）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate upgrade rehearse {{.CLI_ARGS}}

  migrate:apply:
    desc: 绑定升级前保护并执行原地转换或独立目标发布（需 --offline）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate upgrade apply {{.CLI_ARGS}}

  migrate:status:
    desc: 读取独立计划、日志和报告位置
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate status {{.CLI_ARGS}}

  migrate:resume:
    desc: 按 operation kind 和数据库回执恢复（需 --offline）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate resume {{.CLI_ARGS}}

  migrate:verify:
    desc: 只读复核执行库、基线、账号、业务摘要及实际恢复
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate verify {{.CLI_ARGS}}

  migrate:rollback:
    desc: 保留恢复材料并按领域限制回退（需 --offline）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate rollback {{.CLI_ARGS}}

  migrate:storage:
    desc: 当前格式库的遗留存储 plan/apply（可显式接入 ManifestVersion=1）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run -ldflags "{{.BACKEND_LDFLAGS}}" ./cmd/linguaflow-migrate storage {{.CLI_ARGS}}

  migrate:build:
    desc: 构建唯一离线工具（计划绑定此精确二进制摘要；支持 GOOS、GOARCH）
    dir: '{{.TASKFILE_DIR}}'
    vars:
      MIGRATE_BINARY: '{{default "bin/linguaflow-migrate" .MIGRATE_BINARY}}'
      MIGRATE_GOOS: '{{default OS .GOOS}}'
    env:
      GOOS: '{{.MIGRATE_GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
    cmds:
      - go build -ldflags "{{.BACKEND_LDFLAGS}}" -o "{{.MIGRATE_BINARY}}{{if eq .MIGRATE_GOOS "windows"}}.exe{{end}}" ./cmd/linguaflow-migrate

  migrate:release:
    desc: 通过 migrate:build 构建六平台离线迁移工具并生成 SHA-256 文件
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File ./scripts/migrate-release.ps1

  migrate:test:
    desc: 统一迁移专项及真实发布 schema 验收（外部环境缺失仍为 unverified）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -count=1 {{default "./internal/migration/... ./internal/database ./internal/config" .CLI_ARGS}}

  migrate:test:postgres:
    desc: 使用临时隔离 PostgreSQL 18.6 验收升级和存储保护及 clone/rehearsal
    dir: '{{.TASKFILE_DIR}}'
    env:
      LINGUAFLOW_MIGRATION_POSTGRES_TEST_PATTERN: '{{default "^TestPostgres(ServeReleaseDumpRestore|InplaceExternalRestore|AutoInplaceDumpOnly|StorageProtection)Acceptance$" .CLI_ARGS}}'
    cmds:
      - pwsh -NoProfile -File ./scripts/migrate-postgres-acceptance.ps1

  migrate:test:postgres:run:
    desc: 在临时启动器提供的专用九库与工具中运行 PostgreSQL 策略验收
    dir: '{{.TASKFILE_DIR}}'
    preconditions:
      - sh: test -n "$LINGUAFLOW_MIGRATION_POSTGRES_BIN" && test -n "$LINGUAFLOW_MIGRATION_TEST_POSTGRES_SOURCE_INPLACE" && test -n "$LINGUAFLOW_MIGRATION_TEST_POSTGRES_SOURCE_AUTO" && test -n "$LINGUAFLOW_MIGRATION_TEST_POSTGRES_SOURCE_CLONE" && test -n "$LINGUAFLOW_MIGRATION_TEST_POSTGRES_TARGET_CLONE" && test -n "$LINGUAFLOW_MIGRATION_TEST_POSTGRES_REHEARSAL_CLONE"
        msg: 必须由隔离 PostgreSQL 启动器提供专用数据库与 18.6 工具
    env:
      GOOS: '{{OS}}'
      GOARCH: '{{ARCH}}'
    cmds:
      - go test -count=1 -timeout=15m ./internal/migration/upgrade/v015 ./internal/migration/cli -run '{{default "^TestPostgres(ServeReleaseDumpRestore|InplaceExternalRestore|AutoInplaceDumpOnly|StorageProtection)Acceptance$" .CLI_ARGS}}' -v

  migrate:postgres:provision:
    desc: 仅配置并清理 PostgreSQL 18.6 私有集群和九个验收数据库，不依赖 Go 编译
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - pwsh -NoProfile -File ./scripts/migrate-postgres-acceptance.ps1 -ProvisionOnly

  migrate:check-dependencies:
    desc: 验证正常服务依赖树不包含 internal/migration
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test ./internal/migration/cli -run '^TestServiceDependenciesExcludeMigration$' -count=1

  migrate:test:binary:
    desc: 构建唯一工具并以独立进程验收 SQLite serve/local 全部升级操作
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - migrate:build
    env:
      MIGRATION_ACCEPTANCE_BINARY: '{{.TASKFILE_DIR}}/bin/linguaflow-migrate{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - go test -count=1 ./internal/migration/cli -run '^TestBuiltCLIReleaseAcceptance$' -v

  deps:add:
    desc: 添加或更新显式指定的后端 Go 模块依赖
    dir: '{{.TASKFILE_DIR}}'
    requires:
      vars: [CLI_ARGS]
    cmds:
      - go get {{.CLI_ARGS}}

  install:
    desc: 下载后端 Go 模块依赖
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go mod download

  dev:
    desc: 启动后端开发服务器（自动生成并加载 .env；显式环境变量优先）
    dir: '{{.TASKFILE_DIR}}'
    deps:
      - dev:setup
    cmds:
      - task: dev:serve

  dev:setup:
    desc: 初始化 backend/.env（仅缺失时生成；含 JWT、凭据密钥与初始管理员密码）
    dir: '{{.TASKFILE_DIR}}'
    status:
      - test -f .env
    cmds:
      - |
        set -e
        jwt=$(go run ./cmd/linguaflow secrets generate --stdout)
        master=$(go run ./cmd/linguaflow secrets generate --stdout)
        password=$(go run ./cmd/linguaflow secrets generate --stdout)
        cat > .env <<EOF
        # 由 task backend:dev:setup 生成，仅在文件缺失时创建；已存在时不会覆盖。
        # 含真实密钥且已被 .gitignore 忽略，切勿提交或分享。
        # 显式设置的同名环境变量优先于本文件。
        LINGUAFLOW_JWT_SECRET=$jwt
        LINGUAFLOW_CREDENTIALS_MASTER_KEY=$master

        # 首次启动时初始化管理员，仅初始化阶段读取；实例已初始化后可删除。
        LINGUAFLOW_BOOTSTRAP_ADMIN_USERNAME=admin
        LINGUAFLOW_BOOTSTRAP_ADMIN_EMAIL=admin@example.com
        LINGUAFLOW_BOOTSTRAP_ADMIN_PASSWORD=$password

        # 常用可选变量（取消注释即生效）：
        # LINGUAFLOW_LOG_LEVEL=debug
        # LINGUAFLOW_PORT=8080
        EOF
        echo "已生成 backend/.env：初始管理员用户名 admin，密码等密钥见该文件。"

  dev:serve:
    dir: '{{.TASKFILE_DIR}}'
    dotenv: ['.env']
    cmds:
      - go run ./cmd/linguaflow serve {{.CLI_ARGS}}

  local:dev:
    desc: 以本地模式启动后端开发服务器
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run ./cmd/linguaflow local {{.CLI_ARGS}}

  build:
    desc: 构建后端 CLI/服务程序（支持 GOOS、GOARCH 交叉编译）
    dir: '{{.TASKFILE_DIR}}'
    env:
      GOOS: '{{.TARGET_GOOS}}'
      GOARCH: '{{default ARCH .GOARCH}}'
    cmds:
      - go build -ldflags "{{.BACKEND_LDFLAGS}}" -o "{{.BACKEND_BINARY}}{{.BACKEND_EXE_EXT}}" ./cmd/linguaflow

  run:
    desc: 运行后端 CLI（例如 secrets、config、serve）
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    cmds:
      - go run ./cmd/linguaflow {{.CLI_ARGS}}

  docker:build:
    desc: 从当前源码构建 API 镜像（不构建或嵌入前端）
    dir: '{{.TASKFILE_DIR}}'
    vars:
      IMAGE: '{{default "linguaflow:development" .IMAGE}}'
    cmds:
      - docker build -f ../Dockerfile -t {{.IMAGE}} ..

  test:
    desc: 后端测试（可通过 CLI_ARGS 指定包或测试选项）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test {{default "./..." .CLI_ARGS}}

  test:race:
    desc: 后端竞态检测（可通过 CLI_ARGS 指定包或测试选项）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -race {{default "./..." .CLI_ARGS}}

  test:storage:deployment:
    desc: 显式真实存储部署验收（缺少环境时逐项标记未验收；只清理测试独立命名空间）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -v -count=1 -timeout=10m -run TestStorageDeployment ./internal/service ./internal/store/s3store

  lint:
    desc: 执行后端静态检查
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go vet {{default "./..." .CLI_ARGS}}

  format:
    desc: 格式化指定后端包（默认全部包）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go fmt {{default "./..." .CLI_ARGS}}

  format:check:
    desc: 检查后端 Go 代码格式（不修改文件）
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "以下文件未正确格式化："
          echo "$unformatted"
          exit 1
        fi

  generate:
    desc: 生成后端代码（OpenAPI、ent 等）
    cmds:
      - task: openapi:generate
      - task: ent:generate

  openapi:generate:
    desc: 合并 API 规范并生成后端 OpenAPI Go 代码
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - task --dir "{{.TASKFILE_DIR}}/.." openapi:bundle
      - go generate ./internal/api

  ent:generate:
    desc: 生成后端 ent 代码
    dir: '{{.TASKFILE_DIR}}'
    sources:
      - go.mod
      - go.sum
      - internal/ent/generate.go
      - internal/ent/schema/**/*.go
      - internal/tools/ent-generate/**/*.go
    cmds:
      - go generate ./internal/ent

  security:
    desc: 执行 Go 依赖漏洞扫描
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  ent:check:
    desc: 重新生成并检查 ent 代码是否已同步
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go generate ./internal/ent
      - git diff --exit-code -- internal/ent go.mod go.sum
